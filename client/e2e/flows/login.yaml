# 로그인 — 소셜 제공자 버튼이 있는 화면.
#
# 시안이 **플랫폼별로 다르다** (#338).
#   iOS  docs/figma/i297-new/x1/login_ios_238-1808.png (238:1808)
#   AOS  docs/figma/i297-new/x1/login_aos_1022-4333.png (1022:4333)
#
# **기기가 로그아웃 상태여야 한다.** 소셜 로그인은 자동화할 수 없어서 플로우가
# 스스로 이 화면을 만들지 못한다. 설정 → 로그아웃 을 먼저 한 뒤 돌린다.
#
# 이 화면은 **데이터가 안 바뀐다** — 그래서 시안 겹치기가 바로 먹히는 몇 안 되는
# 화면이다. 목록 화면은 실데이터가 시안과 달라 겹쳐도 데이터 차이만 붉어진다.
#
# 플랫폼마다 **버튼 수가 다르다.** iOS 는 애플까지 셋, 안드로이드는 둘이다.
# 그림도 통째로 다르다 — 병아리가 서로 반대쪽을 보고, 새싹이 화면 반대편에
# 있으며, 몸통 크기까지 다르다. **겹칠 때 시안을 잘못 고르면 절반이 붉어진다.**
appId: kr.twinfang.elum
---
- launchApp
- extendedWaitUntil:
    visible: "카카오로 로그인"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: login
