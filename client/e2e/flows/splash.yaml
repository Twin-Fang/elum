# 스플래시 — 앱을 켜면 **1.7초만** 떴다가 스스로 넘어가는 화면.
#
# 시안: docs/figma/i297-new/x1/splash_1022-4415.png (1022:4415)
#
# ## ⚠️ 두 조건이 맞아야 이 화면이 뜬다
#
# 1. **기기가 로그아웃 상태여야 한다.** 세션이 있고 온보딩까지 끝났으면 화면이
#    첫 프레임에 스스로 건너뛴다 (`shouldSkipSplash`).
# 2. **1.7초 안에 찍어야 한다.** 그 뒤에는 로그인으로 넘어가 있다.
#
# ## 왜 `이룸` 을 기다리나
#
# `launchApp` 은 **프로세스가 떴을 때** 돌아온다 — 첫 프레임이 아니다. 에뮬레이터
# 디버그 빌드는 엔진이 뜨는 데만 5~10초가 걸려서, 바로 찍으면 **런처 화면이
# 찍힌다** (실제로 그렇게 나왔다). 로고에 준 이름을 기다려 화면이 뜬 것을 본다.
#
# 로그인 화면에도 같은 로고가 있으므로 **넘어간 뒤에 찍은 것은 아닌지 못 박는다.**
# 카카오 버튼이 보이면 이미 늦은 것이고, 그때는 플로우가 실패해야 한다 —
# 조용히 엉뚱한 화면을 증적으로 남기는 것보다 낫다.
#
# ## ⚠️ 안드로이드는 이 플로우로 못 잡는다 — 연사를 쓴다
#
#     python3 tool/e2e_burst.py splash android
#
# 에뮬레이터는 명령과 명령 사이가 수백 ms 다. `assertNotVisible` 을 통과한
# **직후**에 이미 로그인으로 넘어가 있어서, 찍힌 것은 로그인 화면이었다.
# 연사는 쉬지 않고 찍은 뒤 시안에 가장 가까운 한 장을 고른다 — 0.25% 로 잡혔다.
# iOS 시뮬레이터는 빨라서 이 플로우로 0.04% 가 나온다.
appId: kr.twinfang.elum
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "이룸"
    timeout: 40000
- assertNotVisible: "카카오로 로그인"
- takeScreenshot: splash
