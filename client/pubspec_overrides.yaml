# 로컬 전용 오버라이드 — 커밋하지 않는다 (.gitignore 대상).
#
# connectivity_plus 7.1.0부터 iOS 네이티브 코드가 `NWPath.isUltraConstrained`
# (iOS 26 SDK)를 쓴다. 7.1.1 CHANGELOG가 Xcode 26.1.1을 요구한다고 못박았다.
# 그래서 Xcode 26 미만에서는 시뮬레이터·기기 빌드가 컴파일 에러로 죽는다.
#
#   Swift Compiler Error: Value of type 'NWPath' has no member 'isUltraConstrained'
#
# CI는 Xcode 26을 쓰므로 영향이 없다. 이 파일은 **로컬에서만** 7.0.0으로 내려
# 빌드를 통과시킨다. 배포 앱은 pubspec.yaml 그대로 7.3.1로 나가므로
# 7.1.0의 NWPathMonitor 경쟁상태 크래시 수정을 잃지 않는다.
#
# Xcode를 26 이상으로 올렸다면 이 파일을 지운다.
dependency_overrides:
  connectivity_plus: 7.0.0
