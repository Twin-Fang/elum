# ===================================================================
# 서버 도메인 외부 감시 (#1052)
# ===================================================================
#
# 2026-11-04 운영 API 가 2시간 넘게 502 였는데 사용자 제보로 알았다. 밖에서 주기적으로 묻는다.
#
# 언제 도는가
# - 30분마다 (GitHub 예약 실행은 몇 분씩 늦을 수 있다 — 감지 지연 30~40분. 사용 시간을 줄이려 10분에서 늘렸다)
# - 손으로 (workflow_dispatch)
#
# 무엇을 하나
# - 운영 서버의 /healthz 를 묻는다. 실패하면 60초 뒤 한 번 더, 그래도 실패면 장애 알림 Discord 로 보낸다
# - 실행 사이에 상태를 저장하지 않는다. 장애가 이어지는 동안 30분마다 알림, 회복 알림은 없다
# - Secret DISCORD_INCIDENT_WEBHOOK_URL 이 없으면 알림만 건너뛰고 job 은 실패로 남긴다
# ===================================================================

name: PROJECT-ELUM-UPTIME-CHECK

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

# 앞 실행이 아직 재확인 대기 중이면 새 실행이 대신한다
concurrency:
  group: elum-uptime-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "운영 (내 NAS)"
            url: "https://api.elum.suhsaechan.kr/healthz"
    steps:
      - name: 헬스체크
        id: health
        env:
          TARGET_URL: ${{ matrix.target.url }}
        run: |
          # 응답 코드만 본다 (본문은 남기지 않음), 연결 실패는 000
          # curl 은 연결 실패 때도 -w 로 000 을 찍고 실패 종료하므로 출력만 받는다
          probe() { curl -s -o /dev/null --max-time 10 -w '%{http_code}' "${TARGET_URL}" || true; }
          code="$(probe)"
          if [ "${code}" != "200" ]; then
            echo "1차 실패 (HTTP ${code}) -> 60초 뒤 재확인"
            sleep 60
            code="$(probe)"
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "[uptime] ${TARGET_URL} -> HTTP ${code}"

      - name: 장애 Discord 알림
        if: ${{ steps.health.outputs.code != '200' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_INCIDENT_WEBHOOK_URL }}
          TARGET_NAME: ${{ matrix.target.name }}
          TARGET_URL: ${{ matrix.target.url }}
          HTTP_CODE: ${{ steps.health.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_INCIDENT_WEBHOOK_URL 미등록 -> 장애 알림 건너뜀"
          else
            NOW_KST="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
            MESSAGE="$(printf '**[ELUM 장애] %s 응답 없음**\n시각: %s (KST)\n주소: %s\nHTTP: %s\n실행 기록: %s' \
              "${TARGET_NAME}" "${NOW_KST}" "${TARGET_URL}" "${HTTP_CODE}" "${RUN_URL}")"
            # allowed_mentions 비움 > 멘션 없음. 웹훅 주소는 출력하지 않는다
            jq -n --arg content "${MESSAGE}" '{content: $content, allowed_mentions: {parse: []}}' \
              | curl -fsS --max-time 15 -o /dev/null -w '%{http_code}\n' \
                  -H 'Content-Type: application/json' --data @- "${DISCORD_WEBHOOK_URL}" \
              || echo "::warning::장애 Discord 알림 발송 실패"
          fi
          # 장애를 Actions 화면에도 남긴다
          echo "::error::${TARGET_NAME} 응답 없음 (HTTP ${HTTP_CODE})"
          exit 1
