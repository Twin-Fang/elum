# ===================================================================
# 게시된 공개 페이지와 서버 동의 문서가 어긋나지 않는지 본다 (이슈 #288)
# ===================================================================
#
# 방침이 두 곳에 산다 — 게시 페이지(gh-pages)와 서버가 들고 있는 동의 문서
# (server/src/main/resources/consent/). 한쪽만 고치면 조용히 어긋난다.
#
# 실제로 그렇게 어긋났다. 지원 페이지는 "원문은 따로 보관하지 않아요"라고 적어
# 두었는데 서버는 원문을 저장하고 방침에도 보관한다고 적혀 있었다. **같은 사이트의
# 두 페이지가 개인정보 처리에 대해 서로 다른 말을 했고 그중 하나가 사실과 달랐다.**
#
# 사람이 두 곳을 눈으로 맞추는 일은 반드시 빠진다. 그래서 값으로 묻는다.
#
# 언제 도는가
# - 서버 동의 문서나 검사기를 고쳤을 때 (그 자리에서 바로 안다)
# - 매주 월요일 (gh-pages 는 이 저장소 밖에서 바뀔 수 있다 — push 로는 못 잡는다)
# - 손으로 (workflow_dispatch)
#
# 실패하면 무엇을 하나
# - 로그에 어긋난 항목이 그대로 찍힌다. 게시본이나 서버 문서 중 사실인 쪽에 맞춘다.
# ===================================================================

name: PROJECT-ELUM-PUBLIC-PAGES-CHECK

on:
  push:
    branches: [develop, main]
    paths:
      - 'server/src/main/resources/consent/**'
      - 'tool/check_public_pages.py'
  pull_request:
    branches: [develop]
    paths:
      - 'server/src/main/resources/consent/**'
      - 'tool/check_public_pages.py'
  schedule:
    # 매주 월요일 00:10 UTC (한국 09:10)
    - cron: '10 0 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: 공개 페이지 대조
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 게시본과 서버 문서를 맞대본다
        run: python3 tool/check_public_pages.py
