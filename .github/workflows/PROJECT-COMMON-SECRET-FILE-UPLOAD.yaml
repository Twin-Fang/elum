# ===================================================================
# PROJECT-COMMON-SECRET-FILE-UPLOAD.yaml
# GitHub Secret 파일 서버(SSH) 자동 업로드
# ===================================================================
#
# GitHub Secrets에 저장된 설정 파일들을 서버(SSH 접속 가능한 호스트)에
# 자동 업로드하여 변경 이력을 추적합니다.
# 타임스탬프 기반 백업으로 변경 히스토리를 보존합니다.
#
# ===================================================================
# 🤖 AI 에이전트 커스텀 가이드
# ===================================================================
# 이 워크플로우를 프로젝트에 맞게 수정하려면,
# 아래 프롬프트를 AI 에이전트에게 전달하세요:
#
# 📋 프롬프트:
# "PROJECT-COMMON-SECRET-FILE-UPLOAD.yaml을
#  프로젝트에 맞게 수정해줘.
#  - 프로젝트명: {프로젝트명}
#  - 역할(ROLE): {backend/frontend 등}
#  - 서버 저장 경로: {서버 저장 경로}
#  - SSH 포트: {포트번호}
#  - 업로드할 GitHub Secrets:
#    SECRET_KEY → 저장할_파일명.확장자
#  기존 파일 목록 섹션에 추가하고,
#  없는 Secret은 스킵하도록 해줘."
#
# 💡 예시:
# "- APPLICATION_PROD_YML → application-prod.yml
#  - FIREBASE_KEY_JSON → firebase-admin-sdk.json
#  - VERTEX_SA_KEY → vertex-sa-key.json
#  - ENV_FILE → .env
#  - ADMIN_YML → admin.yml"
# ===================================================================
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
# SERVER_HOST: 서버 호스트(SSH 접속 주소)
# SERVER_USER: SSH 사용자명
# SERVER_PASSWORD: SSH 비밀번호
# ===================================================================
#
# 🔧 환경변수 설정 (env 섹션에서 설정)
# ===================================================================
#
# 📦 프로젝트 설정:
# PROJECT_NAME: 프로젝트명 (서버 경로에 사용)
# 역할 폴더(backend/client)는 아래 시크릿 목록에서 시크릿마다 지정한다
# SERVER_BASE_PATH: 서버 기본 경로 (기본: /volume1/projects, 예: AWS EC2 /home/ubuntu/projects)
#
# 🔌 SSH 연결:
# SSH_PORT: SSH 포트 (기본: 2022)
# ===================================================================

name: PROJECT-COMMON-SECRET-FILE-UPLOAD

# ===================================================================
# 트리거 설정
# ===================================================================
# develop 브랜치에 push할 때 자동 실행됩니다.
# workflow_dispatch로 수동 실행도 가능합니다.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: secret-file-upload-${{ github.ref }}
  cancel-in-progress: true

# ===================================================================
# 환경 변수 설정
# ===================================================================
env:
  # 🔧 프로젝트 설정 - 프로젝트에 맞게 수정하세요
  PROJECT_NAME: "elum"
  SERVER_BASE_PATH: "/volume1/projects"
  SSH_PORT: "2022"

jobs:
  upload-secret-files:
    name: Secret 파일 업로드
    runs-on: ubuntu-latest
    # [skip ci] 커밋 메시지가 포함된 경우 실행하지 않음
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: 타임스탬프 및 커밋 정보 생성
        run: |
          export TZ='Asia/Seoul'
          TIMESTAMP=$(date '+%Y-%m-%d_%H-%M-%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date '+%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "SHORT_COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_ENV
          echo "생성된 타임스탬프: $TIMESTAMP"

      - name: Secret 파일 업로드
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -e

            # GitHub Actions 환경변수 직접 설정
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            SERVER_BASE_PATH="${{ env.SERVER_BASE_PATH }}"
            TIMESTAMP="${{ env.TIMESTAMP }}"
            SHORT_COMMIT_HASH="${{ env.SHORT_COMMIT_HASH }}"
            BUILD_DATE="${{ env.BUILD_DATE }}"

            # 경로 설정: {기본경로}/{프로젝트}/github_secret/{backend|client}
            ROOT_DIR="${SERVER_BASE_PATH}/${PROJECT_NAME}/github_secret"

            echo "=== Secret 파일 업로드 시작 ==="
            echo "프로젝트: ${PROJECT_NAME}"
            echo "경로: ${ROOT_DIR}"
            echo "타임스탬프: ${TIMESTAMP}"

            export PW="${{ secrets.SERVER_PASSWORD }}"
            echo "$PW" | sudo -S mkdir -p "${ROOT_DIR}/backend/${TIMESTAMP}" "${ROOT_DIR}/client/${TIMESTAMP}"

            # 역할별로 올린 파일 목록 (메타데이터 JSON용)
            : > /tmp/_uploaded_backend
            : > /tmp/_uploaded_client

            # 비어 있지 않을 때만 최신본 + 타임스탬프 백업본으로 저장한다.
            # 평문 시크릿이라 소유자(root)만 읽도록 권한을 줄인다.
            put_secret() {
              local role="$1" name="$2" file="$3"
              if [ -s /tmp/_secret_check ] && [ -n "$(tr -d '[:space:]' < /tmp/_secret_check)" ]; then
                sudo cp /tmp/_secret_check "${ROOT_DIR}/${role}/${file}"
                sudo cp /tmp/_secret_check "${ROOT_DIR}/${role}/${TIMESTAMP}/${file}"
                sudo chmod 600 "${ROOT_DIR}/${role}/${file}" "${ROOT_DIR}/${role}/${TIMESTAMP}/${file}"
                echo "${name}|${file}" >> "/tmp/_uploaded_${role}"
                echo "${name} → ${role}/${file} 업로드 완료"
              else
                echo "${name} 스킵 (Secret 미설정)"
              fi
              rm -f /tmp/_secret_check
            }

            # ============================================
            # 📦 파일 업로드 섹션
            # Secret이 비어있으면 자동 스킵됩니다.
            # ============================================

            # --- ENV_FILE → backend/.env ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.ENV_FILE }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "backend" "ENV_FILE" ".env"

            # --- APPLICATION_PROD_YML → backend/application-prod.yml ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.APPLICATION_PROD_YML }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "backend" "APPLICATION_PROD_YML" "application-prod.yml"

            # --- SERVER_HOST → backend/SERVER_HOST.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.SERVER_HOST }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "backend" "SERVER_HOST" "SERVER_HOST.txt"

            # --- SERVER_USER → backend/SERVER_USER.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.SERVER_USER }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "backend" "SERVER_USER" "SERVER_USER.txt"

            # --- SERVER_PASSWORD → backend/SERVER_PASSWORD.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.SERVER_PASSWORD }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "backend" "SERVER_PASSWORD" "SERVER_PASSWORD.txt"

            # --- SERVER_PORT → backend/SERVER_PORT.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.SERVER_PORT }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "backend" "SERVER_PORT" "SERVER_PORT.txt"

            # --- DOCKERHUB_USERNAME → backend/DOCKERHUB_USERNAME.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.DOCKERHUB_USERNAME }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "backend" "DOCKERHUB_USERNAME" "DOCKERHUB_USERNAME.txt"

            # --- DOCKERHUB_TOKEN → backend/DOCKERHUB_TOKEN.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.DOCKERHUB_TOKEN }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "backend" "DOCKERHUB_TOKEN" "DOCKERHUB_TOKEN.txt"

            # --- FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 → backend/FIREBASE_SERVICE_ACCOUNT_JSON_BASE64.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "backend" "FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" "FIREBASE_SERVICE_ACCOUNT_JSON_BASE64.txt"

            # --- CLIENT_ENV_FILE → client/.env ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.CLIENT_ENV_FILE }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "CLIENT_ENV_FILE" ".env"

            # --- CLIENT_ADMOB_ENV_STAGED → client/admob-env-staged.env ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.CLIENT_ADMOB_ENV_STAGED }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "CLIENT_ADMOB_ENV_STAGED" "admob-env-staged.env"

            # --- GOOGLE_SERVICES_JSON → client/google-services.json ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.GOOGLE_SERVICES_JSON }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "GOOGLE_SERVICES_JSON" "google-services.json"

            # --- GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 → client/GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64.txt"

            # --- RELEASE_KEYSTORE_BASE64 → client/RELEASE_KEYSTORE_BASE64.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "RELEASE_KEYSTORE_BASE64" "RELEASE_KEYSTORE_BASE64.txt"

            # --- RELEASE_KEYSTORE_PASSWORD → client/RELEASE_KEYSTORE_PASSWORD.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "RELEASE_KEYSTORE_PASSWORD" "RELEASE_KEYSTORE_PASSWORD.txt"

            # --- RELEASE_KEY_ALIAS → client/RELEASE_KEY_ALIAS.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.RELEASE_KEY_ALIAS }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "RELEASE_KEY_ALIAS" "RELEASE_KEY_ALIAS.txt"

            # --- RELEASE_KEY_PASSWORD → client/RELEASE_KEY_PASSWORD.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.RELEASE_KEY_PASSWORD }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "RELEASE_KEY_PASSWORD" "RELEASE_KEY_PASSWORD.txt"

            # --- APPLE_CERTIFICATE_BASE64 → client/APPLE_CERTIFICATE_BASE64.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "APPLE_CERTIFICATE_BASE64" "APPLE_CERTIFICATE_BASE64.txt"

            # --- APPLE_CERTIFICATE_PASSWORD → client/APPLE_CERTIFICATE_PASSWORD.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "APPLE_CERTIFICATE_PASSWORD" "APPLE_CERTIFICATE_PASSWORD.txt"

            # --- APPLE_PROVISIONING_PROFILE_BASE64 → client/APPLE_PROVISIONING_PROFILE_BASE64.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "APPLE_PROVISIONING_PROFILE_BASE64" "APPLE_PROVISIONING_PROFILE_BASE64.txt"

            # --- APPLE_TEAM_ID → client/APPLE_TEAM_ID.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.APPLE_TEAM_ID }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "APPLE_TEAM_ID" "APPLE_TEAM_ID.txt"

            # --- APP_STORE_CONNECT_API_KEY_BASE64 → client/APP_STORE_CONNECT_API_KEY_BASE64.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "APP_STORE_CONNECT_API_KEY_BASE64" "APP_STORE_CONNECT_API_KEY_BASE64.txt"

            # --- APP_STORE_CONNECT_API_KEY_ID → client/APP_STORE_CONNECT_API_KEY_ID.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "APP_STORE_CONNECT_API_KEY_ID" "APP_STORE_CONNECT_API_KEY_ID.txt"

            # --- APP_STORE_CONNECT_ISSUER_ID → client/APP_STORE_CONNECT_ISSUER_ID.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "APP_STORE_CONNECT_ISSUER_ID" "APP_STORE_CONNECT_ISSUER_ID.txt"

            # --- IOS_BUNDLE_ID → client/IOS_BUNDLE_ID.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.IOS_BUNDLE_ID }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "IOS_BUNDLE_ID" "IOS_BUNDLE_ID.txt"

            # --- IOS_PROVISIONING_PROFILE_NAME → client/IOS_PROVISIONING_PROFILE_NAME.txt ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
            __SUH_SECRET_CHECK_EOF__
            put_secret "client" "IOS_PROVISIONING_PROFILE_NAME" "IOS_PROVISIONING_PROFILE_NAME.txt"

            # ============================================
            # 📋 역할별 메타데이터 JSON 생성
            # ============================================
            for role in backend client; do
              FILES_JSON=""
              while IFS='|' read -r sname sfile; do
                [ -z "$sname" ] && continue
                FILES_JSON="${FILES_JSON:+$FILES_JSON,}{\"secret_name\": \"$sname\", \"file_name\": \"$sfile\", \"last_updated\": \"$BUILD_DATE\"}"
              done < "/tmp/_uploaded_${role}"

              cat << EOF | sudo tee "${ROOT_DIR}/${role}/${TIMESTAMP}/cicd-gitignore-file.json" > /dev/null
            {
              "build_info": {
                "timestamp": "$TIMESTAMP",
                "workflow": "Secret 파일 자동 업로드",
                "role": "$role",
                "run_id": "${{ github.run_id }}",
                "run_number": "${{ github.run_number }}",
                "event": "${{ github.event_name }}",
                "repository": "${{ github.repository }}",
                "branch": "${{ github.ref_name }}",
                "commit_hash": "${{ github.sha }}",
                "short_hash": "$SHORT_COMMIT_HASH",
                "commit_url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
                "actor": "${{ github.actor }}",
                "build_date": "$BUILD_DATE"
              },
              "files": [$FILES_JSON]
            }
            EOF

              # 타임스탬프 인덱스 업데이트
              echo "{\"last_updated\": \"${TIMESTAMP}\", \"commit\": \"${SHORT_COMMIT_HASH}\", \"actor\": \"${{ github.actor }}\", \"status\": \"completed\"}" | sudo tee "${ROOT_DIR}/${role}/timestamp_index.json" > /dev/null
              rm -f "/tmp/_uploaded_${role}"
            done

            echo "=== 모든 파일 업로드 완료 ==="
