<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>이룸 ELUM — 초대 링크</title>
<meta name="description" content="이룸이를 함께 돌보자는 초대 링크예요. 이룸 앱에서 열어주세요."/>
<!-- 초대 코드는 10분짜리 자격증명이다. 검색에 잡히지 않게 하고, 다른 곳으로 나가는 요청에 주소를 실어 보내지 않는다. -->
<meta name="robots" content="noindex, nofollow"/>
<meta name="referrer" content="no-referrer"/>
<link rel="icon" href="../assets/lumi.svg"/>
<style>
:root{
  --bg:#F7F2EF; --ink:#242634; --muted:#6B6C78; --line:rgba(36,38,52,.09);
  --card:#fff; --accent:#FF8B26; --soft:#FFF7EE;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.62;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:40px 24px 56px;text-align:center}
.mascot{width:96px;height:96px;margin:0 auto 8px;display:block}
h1{margin:12px 0 0;font-size:26px;line-height:1.3;letter-spacing:-.03em;font-weight:800}
.lede{margin:10px 0 0;color:var(--muted);font-size:16px}
.card{margin:28px 0 0;padding:22px 20px;background:var(--card);border-radius:24px;border:1px solid var(--line)}
.code{margin:6px 0 2px;font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:.14em;
  user-select:all;-webkit-user-select:all}
.hint{margin:0;color:var(--muted);font-size:14px}
.btn{display:block;width:100%;margin:12px 0 0;padding:16px 20px;border-radius:18px;border:0;
  font:inherit;font-size:18px;font-weight:800;text-decoration:none;cursor:pointer}
.btn-solid{background:var(--ink);color:#fff}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.steps{margin:28px 0 0;padding:0;list-style:none;text-align:left;font-size:15px;color:var(--muted)}
.steps li{margin:10px 0;padding-left:28px;position:relative}
.steps li::before{content:attr(data-n);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;
  background:var(--soft);color:var(--accent);font-size:12px;font-weight:800;line-height:20px;text-align:center}
.steps b{color:var(--ink)}
.err{margin:28px 0 0;padding:20px;background:var(--card);border-radius:24px;border:1px solid var(--line)}
.err b{display:block;font-size:18px}
.err span{display:block;margin-top:6px;color:var(--muted);font-size:14px}
.err code{font-family:var(--mono);font-size:12px}
[hidden]{display:none !important}
footer{margin-top:40px;color:var(--muted);font-size:12px}
footer a{color:inherit}
</style>
</head>
<body>
<main>
  <img class="mascot" src="../assets/lumi.svg" alt=""/>
  <h1>이룸이를 함께 돌봐요</h1>
  <p class="lede">초대 링크가 도착했어요</p>

  <!-- 코드가 있을 때 -->
  <section id="ok" hidden>
    <div class="card">
      <p class="hint">초대 코드</p>
      <p class="code" id="code" aria-label="초대 코드"></p>
      <p class="hint">10분 동안만 쓸 수 있어요</p>
    </div>
    <a class="btn btn-solid" id="open" href="#">이룸 앱에서 열기</a>
    <a class="btn btn-ghost" id="store" href="#" hidden>이룸 앱 받기</a>
    <ol class="steps">
      <li data-n="1"><b>앱이 있다면</b> 위 버튼을 눌러주세요. 초대 코드가 채워진 화면이 열려요</li>
      <li data-n="2"><b>앱이 없다면</b> 먼저 받은 뒤 이 링크를 다시 눌러주세요</li>
      <li data-n="3"><b>링크가 열리지 않으면</b> 앱의 <b>초대 코드가 있어요</b> 에서 위 여섯 글자를 직접 넣어주세요</li>
    </ol>
  </section>

  <!-- 코드가 없거나 모양이 맞지 않을 때 -->
  <section id="bad" class="err" hidden>
    <b>초대 링크가 맞지 않아요</b>
    <span>보낸 분께 새 링크를 받아주세요</span>
    <span><code>E-INV-LINK</code></span>
  </section>

  <footer>이룸 ELUM · <a href="../privacy.html">개인정보처리방침</a></footer>
</main>

<!-- 이 페이지는 코드를 어디로도 보내지 않는다 — 읽어서 화면에 보여 주고 앱 주소로 넘길 뿐이다.
     코드는 주소의 조각(#code=…)에 있어 브라우저가 서버로 보내지 않는다. 쿼리(?code=…)도 받는다.
     이 파일은 저장소의 docs/public-pages/invite/index.html 이 원본이다. gh-pages 의 invite/index.html 로 복사해 게시한다. -->
<script>
(function () {
  'use strict';

  // 앱의 LinkCode.alphabet 과 같은 집합(헷갈리는 글자 0 O 1 I L U 제외 30자). 다르면 앱이 코드를 거절한다.
  var SHAPE = /^[2-9A-HJKMNP-TV-Z]{6}$/;
  // 앱 주소. 앱의 InviteLink.appUrl 과 같은 모양이어야 한다.
  var APP_URL = 'elum://invite?code=';
  var ANDROID_STORE = 'https://play.google.com/store/apps/details?id=kr.twinfang.elum';
  var IOS_STORE = 'https://apps.apple.com/kr/app/id6792970508';

  // 주소에서 코드 파라미터 값을 꺼낸다. 첫 번째 것만 쓴다.
  function pick(str) {
    var s = String(str || '').replace(/^[#?]/, '');
    var parts = s.split('&');
    for (var i = 0; i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      var name = eq < 0 ? parts[i] : parts[i].slice(0, eq);
      if (safeDecode(name).toLowerCase() === 'code') {
        return eq < 0 ? '' : parts[i].slice(eq + 1);
      }
    }
    return null;
  }

  function safeDecode(s) {
    try { return decodeURIComponent(String(s).replace(/\+/g, ' ')); } catch (e) { return null; }
  }

  // 쓸 수 있는 코드면 정규화한 값, 아니면 null. 긴 입력은 풀지 않는다.
  function parseCode(search, hash) {
    var raw = pick(search);
    if (raw === null) raw = pick(hash);
    if (raw === null || raw.length > 64) return null;
    var v = safeDecode(raw);
    // 메신저가 한 번 더 인코딩한 경우만 한 번 더 푼다
    if (v !== null && v.indexOf('%') >= 0) v = safeDecode(v);
    if (v === null || v.indexOf('%') >= 0) return null;
    v = v.replace(/[\s-]/g, '').toUpperCase();
    return SHAPE.test(v) ? v : null;
  }

  function show(id) { document.getElementById(id).hidden = false; }

  function run() {
    var code = parseCode(location.search, location.hash);
    if (!code) { show('bad'); return; }

    document.getElementById('code').textContent = code.slice(0, 3) + ' ' + code.slice(3);
    // 앱 주소는 눌렀을 때만 연다 — 앱이 없는 휴대폰에서 저절로 오류가 뜨지 않게 한다.
    document.getElementById('open').setAttribute('href', APP_URL + code);

    var ua = navigator.userAgent || '';
    var store = document.getElementById('store');
    if (/android/i.test(ua)) { store.setAttribute('href', ANDROID_STORE); store.hidden = false; }
    else if (/iphone|ipad|ipod/i.test(ua)) { store.setAttribute('href', IOS_STORE); store.hidden = false; }
    show('ok');
  }

  // 시험에서 같은 파일을 불러 쓸 수 있게 둔다 (브라우저에서는 쓰이지 않는다).
  if (typeof module !== 'undefined' && module.exports) { module.exports = { parseCode: parseCode, SHAPE: SHAPE }; }
  else { run(); }
})();
</script>
</body>
</html>
