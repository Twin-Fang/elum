# 이룸 소개 사이트 컨테이너 (시놀로지 /volume1/projects/elum/site)
# 호스트 포트 없음: Traefik(traefik-network) 이 Host 규칙으로 라우팅 > api.elum 백엔드와 같은 방식
services:
  elum-site:
    image: nginx:1.27-alpine
    container_name: elum-site
    restart: unless-stopped
    volumes:
      # 정적 파일·설정은 읽기 전용 바인드 > 파일만 맞추면 재시작 없이 반영
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
    networks:
      - traefik-network
    labels:
      traefik.enable: "true"
      traefik.http.routers.elum-site.entrypoints: web
      traefik.http.routers.elum-site.rule: Host(`elum.suhsaechan.kr`) || Host(`www.elum.suhsaechan.kr`)
      traefik.http.routers.elum-site.service: elum-site
      traefik.http.services.elum-site.loadbalancer.server.port: "80"

networks:
  traefik-network:
    external: true
