<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이룸 ELUM</title>
<style>
  :root { --bg:#ffffff; --fg:#1c1c1e; --muted:#6b6b70; --line:#e3e3e6; --accent:#2f6d4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181a; --fg:#ececed; --muted:#9a9aa0; --line:#2e2f33; --accent:#7dbf9d; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
    line-height:1.7; display:flex; align-items:center; justify-content:center; min-height:100vh;
  }
  .wrap { max-width:560px; padding:40px 20px; }
  h1 { font-size:2rem; margin:0 0 10px; letter-spacing:-0.02em; }
  p { color:var(--muted); margin:0 0 28px; }
  a { color:var(--accent); text-decoration:none; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li { border-bottom:1px solid var(--line); }
  li a { display:block; padding:16px 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>이룸 ELUM</h1>
  <p>발달장애 당사자의 하루를 돕는 일과 카드 앱</p>
  <ul>
    <li><a href="privacy.html">개인정보처리방침 →</a></li>
  </ul>
</div>
</body>
</html>
