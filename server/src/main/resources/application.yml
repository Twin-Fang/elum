spring:
  profiles:
    active: prod
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: true
        use_sql_comments: true
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      enabled: true # 파일 업로드 허용
      max-file-size: 200MB # 업로드 파일 최대 크기
      max-request-size: 1000MB # 요청 전체 최대 크기
      file-size-threshold: 10MB
  mvc:
    format:
      date-time: "yyyy-MM-dd'T'HH:mm:ss"
  flyway:
    enabled: true
    # 기존 스키마가 이미 ddl-auto: update로 만들어져 있어 Flyway 마이그레이션 이력이 없으므로,
    # 첫 실행 시 현재 상태를 베이스라인으로 잡고 그 이후 버전만 적용하게 한다.
    baseline-on-migrate: true
    # 기본 baseline 버전은 1인데, 이 값이면 V1 마이그레이션이 "이미 적용된 것"으로 취급돼
    # 건너뛴다. 0으로 낮춰야 V1이 실제로 실행된다.
    baseline-version: 0
    # 핫픽스가 main 에 높은 번호를 먼저 올려도, develop 의 낮은 번호(예: V52)가 나중에 배포될 때 적용되게 함
    out-of-order: true
    # 운영 DB 에 이미 적용됐지만 이 브랜치에 파일이 없는 버전(예: main 핫픽스 시점의 V52)은 검증에서 건너뜀
    ignore-migration-patterns: "*:missing"

chuseok22:
  api-change-log:
    enabled: true
    entries-to-show: 10
    date-format: "yyyy-MM-dd"
  logging:
    enabled: true
    # 요청·응답 헤더(Bearer 토큰)와 본문(보호자 원문)은 로그에 남기지 않음, 요청 식별자·URL·실행시간 로그는 유지
    log-request-headers: false
    log-request-body: false
    log-response-headers: false
    log-response-body: false

server:
  forward-headers-strategy: framework
  # Blue/Green 전환 때 옛 컨테이너가 처리 중이던 요청을 끝내고 내려가게 한다. 없으면 SIGTERM 즉시 끊긴다.
  shutdown: graceful

# 단계 음성 미리 만들기 (#675). AI 서버 주소·키는 local-llm 설정을 그대로 쓴다
tts:
  enabled: ${ELUM_TTS_ENABLED:true}
  # /app 마운트 아래 (그림 data/routine-images 와 같은 볼륨)
  speech-storage-path: data/routine-speech

# 이야기(보호자끼리 일과 나눔). 그림 사본은 일과 그림과 같은 볼륨 아래에 둔다
talk:
  image-storage-path: ${ELUM_TALK_IMAGE_PATH:data/talk-images}
  # 신고 메일의 관리자 화면 링크 기준 주소
  admin-base-url: ${ELUM_TALK_ADMIN_BASE_URL:https://api.elum.chuseok22.com}
  # 앱 밖 공유 링크 (/s/{글id}). 미리보기 페이지·썸네일·앱 연결 검증 파일
  share:
    public-base-url: ${ELUM_TALK_SHARE_PUBLIC_BASE_URL:https://api.elum.chuseok22.com}
    # 앱 서명 인증서 SHA-256 (쉼표 구분, 공개값) 2개 (#1041)
    # 업로드 키(client/android/app/keystore/key.jks, 직접 배포 APK), Play 앱 서명 키(Play Console > 앱 무결성 > 앱 서명, Play 설치본)
    android-cert-sha256: ${ELUM_TALK_SHARE_ANDROID_CERT_SHA256:CC:2D:6F:FB:B0:8B:34:8C:2E:A7:51:28:D7:E1:32:A9:CD:D3:B4:11:D9:45:C9:B4:58:88:C7:B1:41:72:FF:49,F7:A8:97:83:78:9C:AC:83:58:A3:65:7A:89:88:7C:7E:8B:71:E9:09:9C:CF:7D:1A:BA:3A:0D:26:D6:BF:BE:44}

elum:
  # 장애 알림 Discord 웹훅 (#648). 주소가 비면 알림만 꺼지고 서버는 그대로 뜬다 (경고 로그 1회)
  incident-alert:
    # 배포 워크플로가 Secret DISCORD_INCIDENT_WEBHOOK_URL 을 이 환경변수로 넘긴다
    discord-webhook-url: ${ELUM_INCIDENT_ALERT_DISCORD_WEBHOOK_URL:}
    # 알림 속 관리자 화면 링크 기준 주소 (뒤에 /admin/dashboard)
    admin-base-url: ${ELUM_INCIDENT_ALERT_ADMIN_BASE_URL:${talk.admin-base-url}}
    # 5xx 급증: 창(초) 안에 기준 건수 이상이면 1회 (503 의도한 멈춤은 제외)
    server-error-threshold: ${ELUM_INCIDENT_ALERT_SERVER_ERROR_THRESHOLD:10}
    server-error-window-seconds: ${ELUM_INCIDENT_ALERT_SERVER_ERROR_WINDOW_SECONDS:300}
    # 같은 알림 재발송 간격 (초). AI 하루 비용 상한은 날짜별 1회
    cooldown-seconds: ${ELUM_INCIDENT_ALERT_COOLDOWN_SECONDS:1800}
    # AI 제공자 줄(OpenAI 그림 등) 연속 실패 기준 (회)
    ai-consecutive-failure-threshold: ${ELUM_INCIDENT_ALERT_AI_CONSECUTIVE_FAILURE_THRESHOLD:5}
  auth:
    legacy-password:
      # 구형 이름 가입 APK가 운영 DB에 계정을 다시 만들지 못하게 기본값을 닫아 둔다.
      # 로컬 E2E에서만 ELUM_AUTH_LEGACY_PASSWORD_ENABLED=true로 명시적으로 연다.
      enabled: ${ELUM_AUTH_LEGACY_PASSWORD_ENABLED:false}

springdoc:
  title: ELUM API
  description: 이룸(ELUM) 보호자/아동 행동 카드 서비스 API 문서
  version: 0.0.1

  servers:
    - url: https://api.elum.chuseok22.com
      description: main-server
    - url: http://localhost:8080
      description: local-server

  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  # API 문서는 관리자 화면 안에 둔다: /admin/** 체인이 로그인한 관리자에게만 연다 (#870)
  api-docs:
    path: /admin/v3/api-docs
  swagger-ui:
    path: /admin/docs/swagger
