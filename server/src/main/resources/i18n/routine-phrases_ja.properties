# 서버가 만들어 내려보내는 일과 문구 (ja). 키 구조는 routine-phrases_ko.properties 와 같다.

suggestion.01.icon=☂️
suggestion.01.text=雨の日の登校準備
suggestion.01.example=雨の日、Elumiがレインコートを着て長靴をはき、傘を持って学校に行きます
suggestion.02.icon=🎒
suggestion.02.text=朝の登校準備
suggestion.02.example=朝、Elumiが起きて顔を洗い、服を着てかばんを背負って学校に行きます
suggestion.03.icon=🚌
suggestion.03.text=スクールバスに乗る
suggestion.03.example=Elumiがはじめてスクールバスに乗るので、並んで乗り、席に座ってシートベルトを締めることを教えたいです
suggestion.04.icon=🏫
suggestion.04.text=はじめて学校に行く日
suggestion.04.example=Elumiがはじめて学校に行く日なので、教室に入って先生にあいさつし、席に座る練習をしたいです
suggestion.05.icon=🏠
suggestion.05.text=下校して家に帰る
suggestion.05.example=学校が終わったら、Elumiがかばんを背負って靴をはきかえ、家に帰って手を洗う練習をしたいです
suggestion.06.icon=🚗
suggestion.06.text=車で移動する
suggestion.06.example=車で遠くに出かけるので、Elumiがチャイルドシートに座ってベルトを締め、着くまで座っていてほしいです
suggestion.07.icon=🚶
suggestion.07.text=手をつないで道を渡る
suggestion.07.example=Elumiが横断歩道の前で止まり、青信号を見て手をつないで渡る練習をしたいです
suggestion.08.icon=🚏
suggestion.08.text=バス停で待つ
suggestion.08.example=バス停でElumiが並んで待ち、バスが来たら交通系ICカードをタッチして乗ることを教えたいです
suggestion.09.icon=🧥
suggestion.09.text=出かける前に服を着る
suggestion.09.example=出かける前に、Elumiが上着を着て靴をはき、帽子をかぶるのを自分でできるようになってほしいです
suggestion.10.icon=🛒
suggestion.10.text=スーパーに行く
suggestion.10.example=Elumiとスーパーに行って、カートを押し、お菓子を1つ選んでレジに置いてみたいです
suggestion.11.icon=🏥
suggestion.11.text=病院に行く準備
suggestion.11.example=明日Elumiが病院に行くので、受付をして椅子に座って待ち、診察室に入ることを前もって教えたいです
suggestion.12.icon=💉
suggestion.12.text=予防接種に行く
suggestion.12.example=来週Elumiが予防接種を受けに行くので、袖をまくって腕を出し、終わったら絆創膏をはる練習をしたいです
suggestion.13.icon=🦷
suggestion.13.text=歯医者に行く準備
suggestion.13.example=Elumiがはじめて歯医者に行くので、診察台に横になって口を大きく開ける練習をしたいです
suggestion.14.icon=🩺
suggestion.14.text=健康診断を受ける
suggestion.14.example=健康診断で身長と体重をはかり、聴診器をあてられるのを、Elumiがこわがらないでほしいです
suggestion.15.icon=💊
suggestion.15.text=薬を飲む
suggestion.15.example=Elumiが朝ごはんのあとに薬を水と一緒に飲む習慣をつけたいです
suggestion.16.icon=🪥
suggestion.16.text=歯みがきをする
suggestion.16.example=Elumiが歯ブラシに歯みがき粉をつけて上下の歯をみがき、口をゆすぐのをひとりでできるようになってほしいです
suggestion.17.icon=🛁
suggestion.17.text=お風呂に入る
suggestion.17.example=Elumiが服をぬいで体を石けんで洗い、お湯で流してタオルでふく練習をしたいです
suggestion.18.icon=🧼
suggestion.18.text=手洗いの練習
suggestion.18.example=ごはんの前に、Elumiが水を出して石けんで手をこすり、すすいでタオルでふいてほしいです
suggestion.19.icon=💇
suggestion.19.text=髪を切りに行く
suggestion.19.example=Elumiがはじめて美容院に行くので、椅子に座ってケープをつけ、髪を切る間じっとしている練習をしたいです
suggestion.20.icon=👕
suggestion.20.text=ひとりで着替える
suggestion.20.example=Elumiがパジャマをぬいでシャツを着て、ズボンをはくのをひとりでできるようになってほしいです
suggestion.21.icon=🎒
suggestion.21.text=遠足の準備
suggestion.21.example=来週の遠足に、Elumiがお弁当と水筒とハンカチをかばんに入れます
suggestion.22.icon=🍽️
suggestion.22.text=夕ごはんの準備
suggestion.22.example=夕ごはんの前に、Elumiが手を洗ってスプーンとお箸をテーブルに置いてほしいです
suggestion.23.icon=🥄
suggestion.23.text=ひとりでごはんを食べる練習
suggestion.23.example=Elumiが椅子に座ってスプーンでごはんを食べ、食べ終わったら「ごちそうさまでした」と言う練習をしたいです
suggestion.24.icon=🍪
suggestion.24.text=おやつの時間
suggestion.24.example=おやつの時間に、Elumiが手を洗っておやつを1つ選び、席に座って食べてほしいです
suggestion.25.icon=💧
suggestion.25.text=水を飲む
suggestion.25.example=Elumiがコップに水を注いで、両手で持って飲む練習をしたいです
suggestion.26.icon=🛏️
suggestion.26.text=寝る準備をする
suggestion.26.example=寝る前に、Elumiがパジャマを着て歯みがきをし、電気を消してベッドに横になるのを自分でできるようになってほしいです
suggestion.27.icon=🌙
suggestion.27.text=ひとりで眠る練習
suggestion.27.example=Elumiがぬいぐるみを抱いて布団をかけ、目を閉じてひとりで眠る練習をしています
suggestion.28.icon=⏰
suggestion.28.text=朝起きる
suggestion.28.example=アラームが鳴ったら、Elumiがアラームを止めて起き、布団をたたむ習慣をつけたいです
suggestion.29.icon=🧸
suggestion.29.text=おもちゃを片づける
suggestion.29.example=遊んだあと、Elumiがおもちゃを箱に入れて、箱を棚に置いてほしいです
suggestion.30.icon=😴
suggestion.30.text=お昼寝の準備
suggestion.30.example=お昼寝の前に、Elumiがトイレに行って布団を広げ、横になってほしいです
suggestion.31.icon=📍
suggestion.31.text=新しい場所に行く
suggestion.31.example=はじめての室内遊び場に行くので、Elumiが靴をぬいで手を洗い、中に入って遊ぶことを前もって教えたいです
suggestion.32.icon=🏛️
suggestion.32.text=博物館に行く
suggestion.32.example=今週末に博物館に行くので、Elumiが並んで入場し、小さな声で見学する練習をしたいです
suggestion.33.icon=🎪
suggestion.33.text=はじめてのイベントに参加する
suggestion.33.example=Elumiがはじめて行くイベントで、席に座っていて、終わったら拍手をして出る練習をしたいです
suggestion.34.icon=🏖️
suggestion.34.text=はじめての旅行先
suggestion.34.example=旅行先の宿に入ったら、Elumiが靴をぬいでかばんを置き、トイレの場所を確かめてほしいです
suggestion.35.icon=👩‍🏫
suggestion.35.text=新しい先生に会う
suggestion.35.example=来週Elumiが新しい先生に会うので、目を合わせて「こんにちは」とあいさつする練習をしたいです
suggestion.36.icon=🤝
suggestion.36.text=友だちと遊ぶ
suggestion.36.example=Elumiが友だちに「一緒に遊ぼう」と言って、おもちゃを交代で使う練習をしています
suggestion.37.icon=🛝
suggestion.37.text=公園で遊ぶ
suggestion.37.example=公園でElumiがすべり台に並んで順番を待ち、すべる練習をしたいです
suggestion.38.icon=🎨
suggestion.38.text=図工の準備
suggestion.38.example=図工の時間に、Elumiがエプロンをつけてクレヨンで絵をかき、使い終わったら片づけてほしいです
suggestion.39.icon=📚
suggestion.39.text=読書の時間
suggestion.39.example=毎晩寝る前にElumiと本を1冊選んで、一緒に座って1ページずつめくりながら読みたいです
suggestion.40.icon=🎵
suggestion.40.text=音楽の授業の準備
suggestion.40.example=Elumiが音楽の授業で楽器を受け取り、先生のまねをして振って、終わったら元の場所に戻す練習をしたいです
suggestion.41.icon=🎂
suggestion.41.text=誕生日パーティー
suggestion.41.example=Elumiの誕生日パーティーで、とんがり帽子をかぶってろうそくを吹き消し、ケーキを食べて「ありがとう」と言う練習をしたいです
suggestion.42.icon=🧧
suggestion.42.text=お正月の親せきの集まり
suggestion.42.example=お正月に祖父母の家に行って、Elumiが大人にあいさつし、一緒にごはんを食べることを前もって教えたいです
suggestion.43.icon=🎁
suggestion.43.text=プレゼントを渡す・もらう
suggestion.43.example=Elumiがプレゼントを両手で渡し、もらうときは「ありがとうございます」と言う練習をしてほしいです
suggestion.44.icon=🎆
suggestion.44.text=花火を見に行く
suggestion.44.example=花火を見に行きますが、Elumiは大きな音がこわいので、耳栓をつけて座って見るつもりです
suggestion.45.icon=🥳
suggestion.45.text=友だちの誕生日パーティーに行く
suggestion.45.example=Elumiが友だちの誕生日パーティーに招待されたので、プレゼントを渡してお祝いの歌を歌い、ケーキを食べる練習をしたいです
suggestion.46.icon=🧹
suggestion.46.text=部屋を片づける
suggestion.46.example=Elumiが床にある服を洗濯かごに入れて、本を本棚にしまう習慣をつけてあげたいです
suggestion.47.icon=🗑️
suggestion.47.text=ごみを捨てる
suggestion.47.example=Elumiが食べ終わったお菓子の袋をごみ箱に捨てて、手を洗ってほしいです
suggestion.48.icon=🧺
suggestion.48.text=洗濯物をたたんでしまう
suggestion.48.example=Elumiが乾いたタオルを半分にたたんで、引き出しに入れる練習をしています
suggestion.49.icon=🪞
suggestion.49.text=顔を洗って髪をとかす
suggestion.49.example=朝、Elumiが顔を洗ってタオルでふき、くしで髪をとかすのを自分でできるようになってほしいです
suggestion.50.icon=🍚
suggestion.50.text=食べたお皿を片づける
suggestion.50.example=ごはんを食べ終わったら、Elumiがお皿を流しに運ぶ習慣をつけたいです
suggestion.51.icon=🚽
suggestion.51.text=ひとりでトイレに行く
suggestion.51.example=Elumiがトイレに行って便座に座り、水を流して手を洗うのをひとりでできるようになってほしいです
suggestion.52.icon=👟
suggestion.52.text=靴をはく
suggestion.52.example=Elumiが玄関で座って靴をはき、マジックテープをとめる練習をしています
suggestion.53.icon=🧃
suggestion.53.text=幼稚園のかばんの準備
suggestion.53.example=幼稚園に行く前に、Elumiが水筒と箸箱をかばんに入れて、ファスナーを閉めてほしいです
suggestion.54.icon=🏊
suggestion.54.text=プールに行く
suggestion.54.example=プールでElumiが水着に着替えてシャワーを浴び、ゴーグルをつけて入る練習をしたいです
suggestion.55.icon=🍦
suggestion.55.text=コンビニで買い物をする
suggestion.55.example=Elumiがコンビニでアイスを1つ選んでレジに置き、お金を払う練習をしたいです
suggestion.56.icon=🐶
suggestion.56.text=犬に会う
suggestion.56.example=道で犬に会ったら、Elumiが止まって飼い主に「さわってもいいですか?」と聞くことを教えたいです
suggestion.57.icon=🙋
suggestion.57.text=助けを求める
suggestion.57.example=Elumiが困ったときに手を挙げて「手伝ってください」と言う練習をしたいです
suggestion.58.icon=🧍
suggestion.58.text=並んで待つ
suggestion.58.example=Elumiが列のいちばん後ろに並び、前の人と腕1本分あけて順番を待つ練習をしたいです

