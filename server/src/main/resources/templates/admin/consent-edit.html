<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/fragments/admin-layout :: page('약관 고치기', 'consents', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6">
  <div class="flex flex-wrap items-center gap-2">
    <a th:href="@{/admin/consents}" class="btn btn-ghost btn-sm">← 목록</a>
    <h1 class="text-2xl font-bold" th:text="${document.label}">항목</h1>
    <span class="badge badge-outline font-mono" th:text="${document.version}">버전</span>
    <a th:href="@{/admin/consents/{key}/history(key=${document.consentKey})}"
       class="btn btn-ghost btn-sm ml-auto">이력 보기</a>
  </div>

  <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

  <form th:action="@{/admin/consents/{key}(key=${document.consentKey})}" method="post" class="space-y-6">
    <div class="card bg-base-100 shadow-md">
      <div class="card-body space-y-4">
        <div class="grid gap-4 md:grid-cols-2">
          <label class="form-control">
            <div class="label"><span class="label-text">항목 이름</span></div>
            <input type="text" name="label" class="input input-bordered"
                   th:value="${document.label}" required/>
            <div class="label"><span class="label-text-alt">동의 화면 목록에 보이는 줄입니다</span></div>
          </label>
          <label class="form-control">
            <div class="label"><span class="label-text">한 줄 요약</span></div>
            <input type="text" name="summary" class="input input-bordered"
                   th:value="${document.summary}" required/>
            <div class="label"><span class="label-text-alt">항목 이름 아래에 작게 붙습니다</span></div>
          </label>
        </div>

        <label class="label cursor-pointer justify-start gap-3">
          <input type="checkbox" name="required" value="true" class="checkbox checkbox-primary"
                 th:checked="${document.required}"/>
          <span class="label-text">
            필수 항목입니다
            <span class="block text-xs text-base-content/60">
              끄면 동의하지 않아도 가입할 수 있습니다. 법령이 요구하는 항목을 끄지 마세요
            </span>
          </span>
        </label>

        <label class="form-control">
          <div class="label"><span class="label-text">전문</span></div>
          <textarea name="body" class="textarea textarea-bordered h-96 text-sm leading-relaxed"
                    th:text="${document.body}" required></textarea>
        </label>
      </div>
    </div>

    <div class="card bg-base-200">
      <div class="card-body space-y-4">
        <h2 class="card-title text-base">이 수정을 어떻게 남길까요</h2>

        <label class="form-control">
          <div class="label"><span class="label-text">수정 사유 <span class="text-error">*</span></span></div>
          <input type="text" name="reason" class="input input-bordered"
                 placeholder="예: 문의 이메일 주소 변경 / 개인정보 보유 기간 문구 정정" required/>
          <div class="label">
            <span class="label-text-alt">
              약관은 법적 문서입니다. <b>무엇을 왜 바꿨는지가 곧 증빙</b>이라 비워둘 수 없습니다
            </span>
          </div>
        </label>

        <div class="divider my-0"></div>

        <label class="label cursor-pointer justify-start gap-3">
          <input type="checkbox" name="bumpVersion" value="true" class="checkbox checkbox-warning"
                 id="bump-version"/>
          <span class="label-text">
            버전을 올립니다
            <span class="block text-xs text-base-content/60">
              이후 동의하는 사람은 새 버전으로 기록됩니다. <b>기존 회원에게 다시 묻지는 않습니다</b> —
              내용이 실제로 달라졌을 때만 올리세요
            </span>
          </span>
        </label>

        <label class="form-control max-w-xs">
          <div class="label"><span class="label-text">새 버전</span></div>
          <input type="text" name="newVersion" class="input input-bordered font-mono"
                 th:value="${today}" id="new-version" disabled/>
          <div class="label"><span class="label-text-alt">날짜 형식을 씁니다</span></div>
        </label>
      </div>
    </div>

    <div class="flex justify-end gap-2">
      <a th:href="@{/admin/consents}" class="btn btn-ghost">취소</a>
      <button type="submit" class="btn btn-primary">저장</button>
    </div>
  </form>

  <!-- 레이아웃이 떠 가는 것은 이 <main> 하나뿐이다. 바깥에 두면 렌더링 결과에
       실리지 않아 스크립트가 통째로 사라진다 (실제로 그랬다). -->
  <script>
    // 버전 칸은 올리기로 했을 때만 연다. 늘 열어 두면 올릴 생각이 없을 때도
    // 값이 채워져 있어 "올라간 건가?"를 매번 헷갈리게 한다.
    (function () {
      var bump = document.getElementById('bump-version');
      var version = document.getElementById('new-version');
      if (!bump || !version) return;
      bump.addEventListener('change', function () {
        version.disabled = !bump.checked;
      });
    })();
  </script>
</main>

</body>
</html>
