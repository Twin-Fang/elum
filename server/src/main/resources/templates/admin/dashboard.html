<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/fragments/admin-layout :: page('대시보드', 'dashboard', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6">
    <div>
      <h1 class="text-2xl font-bold">대시보드</h1>
      <p class="text-base-content/60">안녕하세요, <span sec:authentication="name">관리자</span>님</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="stat bg-base-200 rounded-box shadow">
        <div class="stat-title">전체 회원수</div>
        <div class="stat-value text-primary" th:text="${memberCount}">0</div>
        <div class="stat-desc">
          최근 7일 활성 <span th:text="${activeMemberCount}">0</span> ·
          정지 <span th:text="${suspendedMemberCount}">0</span>
        </div>
      </div>
      <div class="stat bg-base-200 rounded-box shadow">
        <div class="stat-title">전체 루틴수</div>
        <div class="stat-value text-primary" th:text="${routineStats.total()}">0</div>
        <div class="stat-desc">
          검토대기 <span th:text="${routineStats.pendingReview()}">0</span> ·
          확정 <span th:text="${routineStats.confirmed()}">0</span> ·
          완료 <span th:text="${routineStats.completed()}">0</span>
        </div>
      </div>
      <div class="stat bg-base-200 rounded-box shadow">
        <div class="stat-title">오늘 AI 호출</div>
        <div class="stat-value text-primary" th:text="${todayAiStats.totalCount}">0</div>
        <div class="stat-desc">
          성공 <span th:text="${todayAiStats.successCount}">0</span> ·
          토큰 <span th:text="${#numbers.formatInteger(todayAiStats.totalTokens, 1, 'COMMA')}">0</span>
        </div>
      </div>
      <div class="stat bg-base-200 rounded-box shadow">
        <div class="stat-title">오늘 AI 추정 비용</div>
        <div class="stat-value text-primary" th:text="'$' + ${#numbers.formatDecimal(todayAiStats.totalCostUsd, 1, 4)}">$0</div>
        <div class="stat-desc">
          <a th:href="@{/admin/monitoring}" class="link link-hover">AI 모니터링 상세 보기</a>
        </div>
      </div>
    </div>
    <!-- 서버 오류. 메모리 집계라 서버가 다시 뜨면 0부터 센다 — 전체 기록은 서버 로그 화면의 elum-error.log. -->
    <div class="card bg-base-200 shadow">
      <div class="card-body p-4 gap-2">
        <div class="flex items-center gap-2">
          <h2 class="font-semibold">최근 24시간 서버 오류</h2>
          <span class="badge" th:classappend="${recentErrors.last24h() > 0} ? 'badge-error' : 'badge-ghost'"
                th:text="${recentErrors.last24h()} + '건'">0건</span>
          <a th:href="@{/admin/logs}" class="link link-hover text-sm ml-auto">서버 로그 보기</a>
        </div>
        <p class="text-xs text-base-content/60"
           th:text="'집계 시작 ' + ${recentErrors.since()}">집계 시작</p>
        <p th:if="${recentErrors.recent().isEmpty()}" class="text-sm text-base-content/60">최근 오류가 없어요</p>
        <ul th:unless="${recentErrors.recent().isEmpty()}" class="space-y-1 text-xs font-mono">
          <li th:each="error : ${recentErrors.recent()}">
            <span class="text-base-content/60"
                  th:text="${error.time()}">시각</span>
            <span class="font-semibold" th:text="${error.logger()}">logger</span>
            <span th:text="${error.message()}">message</span>
          </li>
        </ul>
      </div>
    </div>
  </main>
</body>
</html>
