<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: page('의견 관리', 'feedback', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6">
  <div th:replace="~{admin/fragments/admin-ui :: pageHeader('의견 관리',
       '보호자가 앱에서 보낸 의견이에요. 지우기 전까지 남아요. 처리 상태를 바꿔 어디까지 봤는지 표시하고, 기간·앱 버전·OS로 좁혀요.')}"></div>

  <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
  <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}"></div>

  <div class="flex items-center gap-3 flex-wrap">
    <div th:replace="~{admin/fragments/admin-list :: filterBar(${definition}, ${query})}"></div>
  </div>
  <div class="flex items-center gap-3 flex-wrap">
    <div th:replace="~{admin/fragments/admin-list :: csvExport(${csvExport})}"></div>
    <span class="text-sm text-base-content/60 ml-auto">총 <span th:text="${feedbacks.totalElements}">0</span>건</span>
  </div>

  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead>
      <tr>
        <th:block th:replace="~{admin/fragments/admin-list :: sortHeaders(${definition}, ${query})}"></th:block>
      </tr>
      </thead>
      <tbody>
      <!-- th:replace 가 th:if 보다 먼저 실행된다. 조건을 바깥으로 뺀다. -->
      <th:block th:if="${feedbacks.isEmpty()}">
        <tr th:replace="~{admin/fragments/admin-ui :: emptyRow(7, (${query.q != null or !query.filters.isEmpty()} ? '조건에 맞는 의견이 없어요' : '아직 받은 의견이 없어요'))}"></tr>
      </th:block>
      <tr th:each="f : ${feedbacks.content}">
        <td class="text-xs whitespace-nowrap" th:text="${@adminDate.format(f.createdAt)}">2026-10-08 10:00</td>
        <td class="text-xs">
          <a th:href="@{/admin/members/{id}(id=${f.memberId})}" class="link link-hover font-mono"
             th:title="${f.memberId}" th:text="${#strings.abbreviate(f.memberId, 8)}">abcd1234</a>
          <div class="text-base-content/60 whitespace-nowrap" th:if="${f.appVersion != null or f.os != null}"
               th:text="${f.appVersion ?: '-'} + ' · ' + ${f.os ?: '-'}">1.0.30 · ios 17.5</div>
        </td>
        <td class="wrap-anywhere" style="min-width:12rem">
          <a th:href="@{/admin/feedback/{id}(id=${f.id})}" class="link link-hover"
             th:text="${#strings.abbreviate(f.message, 40)}">의견</a>
        </td>
        <td>
          <span th:if="${f.hasAppLog()}" class="badge badge-info badge-sm">있음</span>
          <span th:unless="${f.hasAppLog()}" class="badge badge-ghost badge-sm">없음</span>
          <span th:if="${f.appLogErrorCount() > 0}" class="badge badge-error badge-sm"
                th:text="'오류 ' + ${f.appLogErrorCount()} + '건'">오류 1건</span>
        </td>
        <td>
          <span class="badge badge-sm"
                th:classappend="${f.status.name() == 'NEW'} ? 'badge-warning' : (${f.status.name() == 'DONE'} ? 'badge-success' : 'badge-info')"
                th:text="${f.status.label}" data-feedback-status>새 의견</span>
        </td>
        <td>
          <span th:replace="~{admin/fragments/admin-list :: lastChangedOr(${f.statusChangedAt}, ${f.statusChangedBy}, '변경 이력 없음')}"></span>
        </td>
        <td>
          <div class="flex items-center gap-2">
            <form th:replace="~{admin/fragments/feedback-status-form :: statusForm(${f}, ${statuses}, ${query}, 'list')}"></form>
            <a th:href="@{/admin/feedback/{id}(id=${f.id})}" class="btn btn-primary btn-xs">보기</a>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{admin/fragments/admin-list :: pager(${feedbacks}, @{${pagerBaseUrl}})}"></div>
</main>
</body>
</html>
