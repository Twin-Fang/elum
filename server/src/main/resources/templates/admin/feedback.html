<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: page('의견 관리', 'feedback', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6">
  <div th:replace="~{admin/fragments/admin-ui :: pageHeader('의견 관리',
       '보호자가 앱에서 보낸 의견이에요. 지우기 전까지 남아요.')}"></div>

  <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>

  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead>
      <tr>
        <th>보낸 때</th>
        <th>회원</th>
        <th>의견</th>
        <th>상태 기록</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <!-- th:replace 가 th:if 보다 먼저 실행된다. 조건을 바깥으로 뺀다. -->
      <th:block th:if="${feedbacks.isEmpty()}">
        <tr th:replace="~{admin/fragments/admin-ui :: emptyRow(5, '아직 받은 의견이 없어요')}"></tr>
      </th:block>
      <tr th:each="f : ${feedbacks.content}">
        <td class="text-xs whitespace-nowrap"
            th:text="${f.createdAt != null ? #temporals.format(f.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">2026-10-08 10:00</td>
        <td class="font-mono text-xs" th:text="${#strings.abbreviate(f.memberId, 8)}">abcd1234</td>
        <td class="wrap-anywhere" style="min-width:12rem">
          <a th:href="@{/admin/feedback/{id}(id=${f.id})}" class="link link-hover"
             th:text="${#strings.abbreviate(f.message, 40)}">의견</a>
        </td>
        <td>
          <span th:if="${f.hasAppLog()}" class="badge badge-info badge-sm">있음</span>
          <span th:unless="${f.hasAppLog()}" class="badge badge-ghost badge-sm">없음</span>
          <span th:if="${f.appLogErrorCount() > 0}" class="badge badge-error badge-sm"
                th:text="'오류 ' + ${f.appLogErrorCount()} + '건'">오류 1건</span>
        </td>
        <td>
          <a th:href="@{/admin/feedback/{id}(id=${f.id})}" class="btn btn-primary btn-xs">보기</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="flex items-center gap-2" th:if="${feedbacks.totalPages > 1}">
    <a th:if="${feedbacks.hasPrevious()}" class="btn btn-sm"
       th:href="@{/admin/feedback(page=${feedbacks.number - 1})}">이전</a>
    <span class="text-sm" th:text="${feedbacks.number + 1} + ' / ' + ${feedbacks.totalPages}">1 / 1</span>
    <a th:if="${feedbacks.hasNext()}" class="btn btn-sm"
       th:href="@{/admin/feedback(page=${feedbacks.number + 1})}">다음</a>
  </div>
</main>
</body>
</html>
