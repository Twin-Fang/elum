<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/fragments/admin-layout :: page('프롬프트 관리', 'prompts', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
      <h1 class="text-2xl font-bold">AI 프롬프트 관리</h1>

      <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
      <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

      <div th:each="prompt : ${prompts}" class="card bg-base-100 shadow-md">
        <div class="card-body space-y-4">
          <h2 class="card-title" th:text="${prompt.promptKey.label}">프롬프트 제목</h2>
          <p class="text-sm text-base-content/60">
            키: <span th:text="${prompt.promptKey}"></span> ·
            마지막 수정: <span th:text="${prompt.updatedAt}"></span> ·
            <a th:href="@{/admin/prompts/{key}/history(key=${prompt.promptKey})}" class="link link-primary">이력 보기</a>
          </p>

          <form th:action="@{/admin/prompts/{key}(key=${prompt.promptKey})}" method="post">
            <textarea name="content" class="prompt-content textarea textarea-bordered w-full h-40"
                      th:text="${prompt.content}" th:attr="data-key=${prompt.promptKey}"></textarea>
            <div class="flex justify-end mt-2">
              <button type="submit" class="btn btn-primary btn-sm">저장</button>
            </div>
          </form>

          <div class="divider">테스트</div>

          <input type="text" class="sample-input input input-bordered w-full"
                 th:attr="data-key=${prompt.promptKey}" placeholder="샘플 입력값을 입력하세요"/>

          <!-- 그림 지시문이면 캐릭터를 고른다. 한국어·영어 지시문 둘 다 (#375) -->
          <select th:if="${prompt.promptKey.name() == 'GEMINI_ROUTINE_IMAGE_PREFIX'
                           or prompt.promptKey.name() == 'ROUTINE_IMAGE_PREFIX_EN'
                           or prompt.promptKey.name() == 'FLUX_ROUTINE_IMAGE_PREFIX'}"
                  class="character-select select select-bordered w-full"
                  th:attr="data-key=${prompt.promptKey}">
            <option value="">캐릭터 미지정</option>
            <option value="LULU">루루</option>
            <option value="POPO">포포</option>
          </select>

          <div class="flex gap-2">
            <button type="button" class="btn btn-outline btn-sm preview-btn"
                    th:attr="data-key=${prompt.promptKey}">미리보기
            </button>
            <button type="button" class="btn btn-secondary btn-sm test-btn"
                    th:attr="data-key=${prompt.promptKey}">실제로 테스트하기
            </button>
          </div>

          <pre class="result-area bg-base-200 rounded p-3 text-xs whitespace-pre-wrap"
               th:attr="data-key=${prompt.promptKey}"></pre>
        </div>
      </div>
    </div>

<script th:inline="javascript">
  // CSRF 토큰은 공통 골격(admin-layout)이 meta 로 낸다. 여기서 meta 를 바로 .content 로 읽으면
  // meta 가 빠졌을 때 첫 줄에서 예외가 나 아래 버튼 처리기가 하나도 붙지 않는다 — 눌러도 반응이 없고
  // 요청이 나가지 않아 서버 로그에도 흔적이 없다(#399). 그래서 요청할 때 읽고, 없으면 화면에 알린다.
  function readMeta(name) {
    const meta = document.querySelector('meta[name="' + name + '"]');
    return meta && meta.content ? meta.content : null;
  }

  function getContentFor(key) {
    return document.querySelector('.prompt-content[data-key="' + key + '"]').value;
  }

  function getSampleInputFor(key) {
    return document.querySelector('.sample-input[data-key="' + key + '"]').value;
  }

  function getCharacterFor(key) {
    const select = document.querySelector('.character-select[data-key="' + key + '"]');
    return select && select.value ? select.value : null;
  }

  function getResultAreaFor(key) {
    return document.querySelector('.result-area[data-key="' + key + '"]');
  }

  async function callPromptApi(key, path, body) {
    const csrfToken = readMeta('_csrf');
    const csrfHeader = readMeta('_csrf_header');
    if (!csrfToken || !csrfHeader) {
      // 토큰 없이 보내면 서버가 403 으로 막는다. 보내지 않고 무엇을 하면 되는지 말한다.
      console.error('[프롬프트] CSRF meta 가 없어 요청하지 않았어요 (E-PRM-CSRF)');
      throw new Error('보안 토큰을 찾지 못했어요 — 새로고침해 주세요. (E-PRM-CSRF)');
    }
    let response;
    try {
      response = await fetch('/admin/prompts/' + key + path, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          [csrfHeader]: csrfToken
        },
        body: JSON.stringify(body)
      });
    } catch (e) {
      console.error('[프롬프트] 요청이 서버에 닿지 못했어요 (E-PRM-NET)', e);
      throw new Error('서버에 닿지 못했어요. 연결을 확인하고 다시 눌러 주세요. (E-PRM-NET)');
    }
    // 403(토큰 만료)·로그인 화면 같은 HTML 응답도 온다. 파싱 오류 문구가 그대로 뜨지 않게 가린다.
    let data = null;
    try {
      data = await response.json();
    } catch (e) {
      data = null;
    }
    if (response.status === 403) {
      throw new Error('보안 토큰이 맞지 않아요 — 새로고침해 주세요. (E-PRM-403)');
    }
    if (!response.ok) {
      throw new Error((data && data.errorMessage) || ('요청이 실패했어요. (E-PRM-HTTP-' + response.status + ')'));
    }
    if (!data) {
      // 로그인이 풀리면 로그인 화면(200 HTML)으로 돌아온다.
      throw new Error('응답을 읽지 못했어요. 로그인이 풀렸을 수 있어요 — 새로고침해 주세요. (E-PRM-PARSE)');
    }
    return data;
  }

  document.querySelectorAll('.preview-btn').forEach(function (btn) {
    btn.addEventListener('click', async function () {
      const key = btn.dataset.key;
      const resultArea = getResultAreaFor(key);
      resultArea.textContent = '미리보기 조합 중...';
      try {
        const data = await callPromptApi(key, '/preview', {
          content: getContentFor(key),
          sampleInput: getSampleInputFor(key),
          character: getCharacterFor(key)
        });
        resultArea.textContent = data.composedPrompt;
      } catch (e) {
        resultArea.textContent = '오류: ' + e.message;
      }
    });
  });

  document.querySelectorAll('.test-btn').forEach(function (btn) {
    btn.addEventListener('click', async function () {
      const key = btn.dataset.key;
      const resultArea = getResultAreaFor(key);
      resultArea.textContent = 'AI 호출 중...';
      try {
        const data = await callPromptApi(key, '/test', {
          content: getContentFor(key),
          sampleInput: getSampleInputFor(key),
          character: getCharacterFor(key)
        });
        if (data.imageDataUri) {
          resultArea.textContent = '';
          const img = document.createElement('img');
          img.src = data.imageDataUri;
          img.className = 'max-w-xs rounded';
          resultArea.appendChild(img);
        } else {
          resultArea.textContent = JSON.stringify(data.result, null, 2);
        }
      } catch (e) {
        resultArea.textContent = '오류: ' + e.message;
      }
    });
  });
</script>
</main>
</body>
</html>
