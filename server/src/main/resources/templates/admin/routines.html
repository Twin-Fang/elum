<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/fragments/admin-layout :: page('루틴 관리', 'routines', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6">
    <h1 class="text-2xl font-bold">루틴 관리</h1>

    <!-- 회원 목록과 같은 모양으로 둔다. 한쪽에만 검색이 있으면 다른 쪽에서도 찾으려다 못 찾는다.
         원문은 검색 대상이 아니다 — 보호자가 적은 말 그대로라 들여다보는 통로가 된다. -->
    <form method="get" th:action="@{/admin/routines}" class="flex flex-wrap items-center gap-2">
      <input type="text" name="keyword" th:value="${keyword}" placeholder="일과 제목 또는 이룸이 호칭"
             class="input input-bordered input-sm w-full sm:w-64"/>
      <button type="submit" class="btn btn-primary btn-sm">검색</button>
      <a th:href="@{/admin/routines}" class="btn btn-ghost btn-sm">초기화</a>
      <span class="ml-auto text-sm text-base-content/60">
        총 <span th:text="${routines.totalElements}">0</span>건
      </span>
    </form>

    <div class="overflow-x-auto">
      <table class="table">
        <thead>
        <tr>
          <th>제목</th>
          <th>보호자</th>
          <th>상태</th>
          <th>예정일시</th>
          <th>완료일시</th>
        </tr>
        </thead>
        <tbody>
        <!-- th:replace 가 th:if 보다 먼저 실행된다. 한 태그에 두면 조건이 무시되고
             데이터가 있어도 빈 줄이 함께 그려진다. 조건을 바깥으로 뺀다. -->
        <th:block th:if="${routines.isEmpty()}">
          <tr th:replace="~{admin/fragments/admin-ui :: emptyRow(5, '아직 만들어진 일과가 없어요')}"></tr>
        </th:block>
        <tr th:each="routine : ${routines.content}">
          <td>
            <a th:href="@{/admin/routines/{id}(id=${routine.id()})}" class="link link-hover font-medium"
               th:text="${routine.title()}">제목</a>
          </td>
          <td th:text="${routine.memberNickname() ?: routine.memberUsername()}">보호자</td>
          <td>
            <span th:if="${routine.status().name() == 'PENDING_REVIEW'}" class="badge badge-warning">검토 대기</span>
            <span th:if="${routine.status().name() == 'CONFIRMED'}" class="badge badge-info">확정</span>
            <span th:if="${routine.status().name() == 'COMPLETED'}" class="badge badge-success">완료</span>
          </td>
          <td th:text="${#temporals.format(routine.scheduledAt(), 'yyyy-MM-dd HH:mm')}">일시</td>
          <td th:text="${routine.completedAt() != null ? #temporals.format(routine.completedAt(), 'yyyy-MM-dd HH:mm') : '-'}">-</td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="flex items-center justify-center gap-2" th:if="${routines.totalPages > 1}">
      <a th:if="${routines.hasPrevious()}" class="btn btn-sm"
         th:href="@{/admin/routines(page=${routines.number - 1}, keyword=${keyword})}">이전</a>
      <span class="text-sm" th:text="${routines.number + 1} + ' / ' + ${routines.totalPages}">1 / 1</span>
      <a th:if="${routines.hasNext()}" class="btn btn-sm"
         th:href="@{/admin/routines(page=${routines.number + 1}, keyword=${keyword})}">다음</a>
    </div>
  </main>
</body>
</html>
