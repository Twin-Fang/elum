<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/fragments/admin-layout :: page('AI 크레딧 · 작업 탐색', 'credits', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6">
  <div>
    <h1 class="text-2xl font-bold">AI 크레딧 · 작업 탐색</h1>
    <p class="text-base-content/60">생성 작업 한 건씩 예약·차감·초과와 연결된 AI 호출을 대조합니다.</p>
  </div>

  <nav th:replace="~{admin/fragments/credit-nav :: nav('jobs')}"></nav>

  <div th:if="${message}" class="alert alert-success" th:text="${message}">완료</div>
  <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">오류</div>

  <form method="get" th:action="@{/admin/credits/jobs}" class="flex flex-wrap items-end gap-2">
    <label class="form-control">
      <span class="label-text text-xs">상태</span>
      <select name="status" class="select select-bordered select-sm">
        <option value="" th:selected="${filter.status() == null}">전체</option>
        <option th:each="status : ${statuses}" th:value="${status.name()}" th:text="${status.name()}"
                th:selected="${filter.status() == status}">RESERVED</option>
      </select>
    </label>
    <label class="form-control">
      <span class="label-text text-xs">종류</span>
      <select name="kind" class="select select-bordered select-sm">
        <option value="" th:selected="${filter.kind() == null}">전체</option>
        <option th:each="kind : ${kinds}" th:value="${kind.name()}" th:text="${kind.name()}"
                th:selected="${filter.kind() == kind}">ROUTINE_CREATE</option>
      </select>
    </label>
    <label class="form-control">
      <span class="label-text text-xs">시작일부터</span>
      <input type="date" name="from" th:value="${filter.from()}" class="input input-bordered input-sm"/>
    </label>
    <label class="form-control">
      <span class="label-text text-xs">시작일까지</span>
      <input type="date" name="to" th:value="${filter.to()}" class="input input-bordered input-sm"/>
    </label>
    <label class="form-control">
      <span class="label-text text-xs">요청 키 · 작업 id</span>
      <input type="text" name="q" th:value="${q}" class="input input-bordered input-sm w-64"/>
    </label>
    <label class="label cursor-pointer gap-1">
      <input type="checkbox" name="overage" value="true" class="checkbox checkbox-sm" th:checked="${filter.overageOnly()}"/>
      <span class="label-text">초과만</span>
    </label>
    <label class="label cursor-pointer gap-1">
      <input type="checkbox" name="mismatch" value="true" class="checkbox checkbox-sm" th:checked="${filter.mismatchOnly()}"/>
      <span class="label-text">대조 불일치만</span>
    </label>
    <button type="submit" class="btn btn-primary btn-sm">찾기</button>
    <a th:href="@{/admin/credits/jobs}" class="btn btn-ghost btn-sm">초기화</a>
    <span class="text-sm text-base-content/60 ml-auto">총 <span th:text="${rows.totalElements}">0</span>건</span>
  </form>

  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead>
      <tr>
        <th>시작</th><th>회원</th><th>종류</th><th>상태</th>
        <th class="text-right">예약</th><th class="text-right">차감</th><th class="text-right">초과</th>
        <th class="text-right">카드 / 그림</th><th class="text-right">호출</th><th class="text-right">USD</th>
        <th>요청 키 · 작업 id</th><th>비고</th>
      </tr>
      </thead>
      <tbody>
      <th:block th:if="${rows.isEmpty()}">
        <tr th:replace="~{admin/fragments/admin-ui :: emptyRow(12, '조건에 맞는 작업이 없어요')}"></tr>
      </th:block>
      <tr th:each="row : ${rows.content}">
        <td class="text-xs whitespace-nowrap" th:text="${#temporals.format(row.job().startedAt, 'MM-dd HH:mm:ss')}">-</td>
        <td>
          <a th:if="${row.memberId() != null}" th:href="@{/admin/credits/members/{id}(id=${row.memberId()})}"
             class="link link-hover text-xs" th:text="${row.username() ?: #strings.abbreviate(row.memberId(), 10)}">회원</a>
          <span th:if="${row.memberId() == null}" class="text-xs text-base-content/40">-</span>
        </td>
        <td class="text-xs" th:text="${row.job().kind.name()}">ROUTINE_CREATE</td>
        <td>
          <span class="badge badge-sm" th:text="${row.job().status.name()}"
                th:classappend="${row.stuck()} ? 'badge-error' : (${row.job().status.name() == 'SETTLED'} ? 'badge-success' : 'badge-ghost')">SETTLED</span>
        </td>
        <td class="text-right" th:text="${row.job().reserved}">0</td>
        <td class="text-right" th:text="${row.job().charged}">0</td>
        <td class="text-right" th:classappend="${row.job().overage > 0} ? 'text-warning'" th:text="${row.job().overage}">0</td>
        <td class="text-right" th:text="${row.job().cardCount} + ' / ' + ${row.job().imageCount}">0 / 0</td>
        <td class="text-right" th:text="${row.callCount()}">0</td>
        <td class="text-right font-mono" th:text="'$' + ${#numbers.formatDecimal(row.costUsd(), 1, 4)}">$0</td>
        <td class="text-xs">
          <div class="font-mono" th:text="${#strings.abbreviate(row.job().requestKey, 24)}" th:title="${row.job().requestKey}">키</div>
          <div class="font-mono text-base-content/50" th:text="${row.job().id}">id</div>
        </td>
        <td class="text-xs">
          <span th:if="${row.mismatch()}" class="badge badge-warning badge-sm">호출 기록 없음</span>
          <span th:if="${row.stuck()}" class="badge badge-error badge-sm">멈춤</span>
          <span th:text="${row.job().failReason}"></span>
          <form th:if="${row.releasable()}" th:action="@{/admin/credits/jobs/{id}/release(id=${row.job().id})}"
                method="post" class="flex gap-1 mt-1"
                onsubmit="return confirm('이 예약을 반환할까요? 잡아 둔 크레딧이 바로 돌아가요.');">
            <input type="hidden" name="back" value="/admin/credits/jobs?status=RESERVED"/>
            <input type="text" name="reason" required maxlength="200" placeholder="반환 사유"
                   class="input input-bordered input-sm w-32"/>
            <button type="submit" class="btn btn-warning btn-sm">반환</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="flex items-center gap-2" th:if="${rows.totalPages > 1}">
    <a th:if="${rows.hasPrevious()}" class="btn btn-sm"
       th:href="@{/admin/credits/jobs(page=${rows.number - 1}, status=${filter.status() != null ? filter.status().name() : ''}, kind=${filter.kind() != null ? filter.kind().name() : ''}, from=${filter.from()}, to=${filter.to()}, overage=${filter.overageOnly()}, mismatch=${filter.mismatchOnly()}, q=${q})}">이전</a>
    <span class="text-sm" th:text="${rows.number + 1} + ' / ' + ${rows.totalPages}">1 / 1</span>
    <a th:if="${rows.hasNext()}" class="btn btn-sm"
       th:href="@{/admin/credits/jobs(page=${rows.number + 1}, status=${filter.status() != null ? filter.status().name() : ''}, kind=${filter.kind() != null ? filter.kind().name() : ''}, from=${filter.from()}, to=${filter.to()}, overage=${filter.overageOnly()}, mismatch=${filter.mismatchOnly()}, q=${q})}">다음</a>
  </div>
</main>
</body>
</html>
