<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  사이드바가 없는 유일한 화면이라 골격(page)을 쓰지 않는다.
  로그인 전에는 메뉴를 보여줄 이유가 없다.
-->
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>이룸 관리자 로그인</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/admin/vendor/logo_elum.svg}"/>
  <link rel="stylesheet" th:href="@{/admin/vendor/admin.css}"/>
  <script th:src="@{/admin/js/admin-ui.js}"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-base-200 p-4">
<div class="card w-full max-w-sm bg-base-100 shadow-xl">
  <div class="card-body">
    <!-- 로고가 브랜드를 말하므로 h1 은 화면 이름만 보조로 적는다. -->
    <div class="flex flex-col items-center gap-2" style="margin-bottom:1.5rem">
      <img th:src="@{/admin/vendor/logo_elum.svg}" alt="이룸" style="height:3.5rem;width:auto"/>
      <h1 class="text-sm font-medium" style="opacity:.6">관리자 로그인</h1>
    </div>

    <!-- 틀렸다는 말을 해 준다. 예전에는 실패해도 빈 화면만 다시 떴다. -->
    <div th:if="${param.error}" class="alert alert-error py-2 text-sm">
      <span>아이디 또는 비밀번호가 맞지 않아요</span>
    </div>
    <div th:if="${param.logout}" class="alert py-2 text-sm">
      <span>로그아웃했어요</span>
    </div>

    <form th:action="@{/admin/login}" method="post" class="space-y-4">
      <div class="form-control">
        <label class="label" for="username"><span class="label-text">아이디</span></label>
        <input type="text" id="username" name="username" class="input input-bordered w-full"
               autocomplete="username" required>
      </div>
      <div class="form-control">
        <label class="label" for="password"><span class="label-text">비밀번호</span></label>
        <input type="password" id="password" name="password" class="input input-bordered w-full"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-full">로그인</button>
    </form>
  </div>
</div>
</body>
</html>
