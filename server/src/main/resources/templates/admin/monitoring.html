<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{admin/fragments/admin-layout :: page('AI 모니터링', 'monitoring', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6">
    <div>
      <h1 class="text-2xl font-bold">AI 모니터링</h1>
      <p class="text-base-content/60">AI 호출 현황과 토큰 사용량, 추정 비용을 확인합니다.</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
      <div class="stat bg-base-200 rounded-box shadow p-4">
        <div class="stat-title text-sm">오늘 호출수</div>
        <div class="stat-value text-primary text-2xl" th:text="${todayStats.totalCount}">0</div>
      </div>
      <div class="stat bg-base-200 rounded-box shadow p-4">
        <div class="stat-title text-sm">오늘 성공률</div>
        <div class="stat-value text-primary text-2xl"
             th:text="${todayStats.totalCount == 0 ? '-' : #numbers.formatDecimal(todayStats.successCount * 100.0 / todayStats.totalCount, 1, 1) + '%'}">-</div>
      </div>
      <div class="stat bg-base-200 rounded-box shadow p-4">
        <div class="stat-title text-sm">오늘 평균 지연</div>
        <div class="stat-value text-primary text-2xl"
             th:text="${#numbers.formatDecimal(todayStats.avgLatencyMs / 1000.0, 1, 1)} + 's'">0s</div>
      </div>
      <div class="stat bg-base-200 rounded-box shadow p-4">
        <div class="stat-title text-sm">오늘 토큰</div>
        <div class="stat-value text-primary text-2xl" th:text="${#numbers.formatInteger(todayStats.totalTokens, 1, 'COMMA')}">0</div>
      </div>
      <div class="stat bg-base-200 rounded-box shadow p-4">
        <div class="stat-title text-sm">오늘 추정 비용</div>
        <div class="stat-value text-primary text-2xl"
             th:text="'$' + ${#numbers.formatDecimal(todayStats.totalCostUsd, 1, 4)}">$0</div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="stat bg-base-200 rounded-box shadow p-4">
        <div class="stat-title text-sm">누적 호출수</div>
        <div class="stat-value text-2xl" th:text="${#numbers.formatInteger(totalStats.totalCount, 1, 'COMMA')}">0</div>
        <div class="stat-desc">성공 <span th:text="${totalStats.successCount}">0</span>건</div>
      </div>
      <div class="stat bg-base-200 rounded-box shadow p-4">
        <div class="stat-title text-sm">누적 추정 비용</div>
        <div class="stat-value text-2xl" th:text="'$' + ${#numbers.formatDecimal(totalStats.totalCostUsd, 1, 4)}">$0</div>
        <div class="stat-desc">누적 토큰 <span th:text="${#numbers.formatInteger(totalStats.totalTokens, 1, 'COMMA')}">0</span></div>
      </div>
    </div>

    <!-- 기간 기본은 최근 7일. 값이 틀리면 서버가 보정해서 다시 채운다 -->
    <form method="get" th:action="@{/admin/monitoring}" class="flex flex-wrap items-end gap-2" data-admin-filter-bar>
      <label class="form-control">
        <span class="label-text text-xs">시작일</span>
        <input type="date" name="from" th:value="${query.filters.get('from')}" class="input input-bordered input-sm"/>
      </label>
      <label class="form-control">
        <span class="label-text text-xs">종료일</span>
        <input type="date" name="to" th:value="${query.filters.get('to')}" class="input input-bordered input-sm"/>
      </label>
      <label class="form-control">
        <span class="label-text text-xs">호출 유형</span>
        <select name="callType" class="select select-bordered select-sm">
          <option value="" th:selected="${query.filters.get('callType') == null}">전체 유형</option>
          <option th:each="type : ${callTypes}" th:value="${type.name()}"
                  th:text="${type.label}" th:selected="${type.name() == query.filters.get('callType')}">유형</option>
        </select>
      </label>
      <label class="form-control">
        <span class="label-text text-xs">결과</span>
        <select name="success" class="select select-bordered select-sm">
          <option value="" th:selected="${query.filters.get('success') == null}">전체 결과</option>
          <option value="true" th:selected="${query.filters.get('success') == 'true'}">성공</option>
          <option value="false" th:selected="${query.filters.get('success') == 'false'}">실패</option>
        </select>
      </label>
      <label class="form-control">
        <span class="label-text text-xs">회원 ID</span>
        <input type="text" name="memberId" th:value="${query.filters.get('memberId')}" maxlength="100"
               placeholder="회원 ID 전체" class="input input-bordered input-sm w-full sm:w-72"/>
      </label>
      <input type="hidden" name="sort" th:value="${query.sort}"/>
      <button type="submit" class="btn btn-primary btn-sm">필터</button>
      <a th:href="@{/admin/monitoring}" class="btn btn-ghost btn-sm">기간 초기화</a>
    </form>

    <div class="overflow-x-auto">
      <table class="table table-sm">
        <thead>
        <tr>
          <th:block th:replace="~{admin/fragments/admin-list :: sortHeaders(${definition}, ${query})}"></th:block>
          <th>유형</th>
          <th>모델</th>
          <th>회원</th>
          <th>결과</th>
          <th>지연</th>
          <th>토큰(입력/출력)</th>
          <th>추정 비용</th>
        </tr>
        </thead>
        <tbody>
        <!-- th:replace 가 th:if 보다 먼저 실행된다. 한 태그에 두면 조건이 무시되고
             데이터가 있어도 빈 줄이 함께 그려진다. 조건을 바깥으로 뺀다. -->
        <th:block th:if="${calls.isEmpty()}">
          <tr th:replace="~{admin/fragments/admin-ui :: emptyRow(8, '조건에 맞는 AI 호출이 없어요')}"></tr>
        </th:block>
        <tr th:each="call : ${calls.content}">
          <td th:text="${#temporals.format(call.createdAt, 'MM-dd HH:mm:ss')}">시각</td>
          <td th:text="${call.callType.label}">유형</td>
          <td class="text-xs" th:text="${call.model}">모델</td>
          <td>
            <!-- substring은 ID가 8자보다 짧으면 예외를 던져 화면이 통째로 죽는다.
                 abbreviate는 짧으면 자르지 않고 그대로 둔다. -->
            <a th:if="${call.memberId != null}" th:href="@{/admin/members/{id}(id=${call.memberId})}"
               class="link link-hover text-xs" th:text="${#strings.abbreviate(call.memberId, 10)}">회원</a>
            <span th:if="${call.memberId == null}" class="text-base-content/40 text-xs">-</span>
          </td>
          <td>
            <span th:if="${call.success}" class="badge badge-success badge-sm">성공</span>
            <span th:unless="${call.success}" class="badge badge-error badge-sm" th:title="${call.errorMessage}">실패</span>
          </td>
          <td th:text="${call.latencyMs != null ? call.latencyMs + 'ms' : '-'}">지연</td>
          <td th:text="${call.totalTokens != null ? (call.promptTokens ?: 0) + ' / ' + (call.outputTokens ?: 0) : '-'}">토큰</td>
          <td th:text="${call.estimatedCostUsd != null ? '$' + #numbers.formatDecimal(call.estimatedCostUsd, 1, 6) : '-'}">비용</td>
        </tr>
        </tbody>
      </table>
    </div>

    <div th:replace="~{admin/fragments/admin-list :: pager(${calls}, @{${pagerBaseUrl}})}"></div>
  </main>
</body>
</html>
