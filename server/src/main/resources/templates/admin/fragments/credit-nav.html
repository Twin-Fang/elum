<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  AI 크레딧 화면들의 윗줄 메뉴 (이슈 #407). 사이드 메뉴는 "AI 크레딧" 하나라 화면 사이는 여기서 오간다.
  탭 모양은 서버 로그 화면과 같은 daisyUI tabs-boxed (#657)
-->
<body>

<nav th:fragment="nav(tab)" role="tablist" class="tabs tabs-boxed w-fit flex-wrap" aria-label="AI 크레딧 화면">
  <a th:href="@{/admin/credits}" role="tab" class="tab"
     th:classappend="${tab == 'overview'} ? 'tab-active'">개요</a>
  <a th:href="@{/admin/credits/members}" role="tab" class="tab"
     th:classappend="${tab == 'members'} ? 'tab-active'">회원별</a>
  <a th:href="@{/admin/credits/jobs}" role="tab" class="tab"
     th:classappend="${tab == 'jobs'} ? 'tab-active'">작업 탐색</a>
  <a th:href="@{/admin/credits/policy}" role="tab" class="tab"
     th:classappend="${tab == 'policy'} ? 'tab-active'">정책</a>
</nav>

</body>
</html>
