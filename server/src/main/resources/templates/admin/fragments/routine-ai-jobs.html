<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  일과 상세 "이 일과의 AI 작업" 카드 (#652). 작업 = 크레딧 작업(AiCreditJob.routineId), 호출 = 작업에 묶인 AI 호출
  상태 3개: 불러옴, 작업 없음, 불러오기 실패(isLoadFailed). 질문·다시 만들기처럼 작업 밖 호출은 합계에 없음
-->
<body>

<div th:fragment="aiJobsCard(aiJobs)" class="card bg-base-100 shadow-md" data-routine-ai-jobs>
  <div class="card-body p-4 gap-3">
    <h2 class="card-title text-lg">이 일과의 AI 작업</h2>
    <p th:if="${aiJobs.isLoadFailed()}" class="text-sm text-error" role="alert">
      AI 작업을 불러오지 못했어요. 잠시 뒤 새로 고쳐 주세요.
      (<code th:text="${aiJobs.loadFailedErrorCode()}">E-ADM-ROUTINE-001</code>)
    </p>
    <th:block th:unless="${aiJobs.isLoadFailed()}">
      <div class="flex flex-wrap gap-4 text-sm">
        <span>작업 <b th:text="${aiJobs.jobs().size()}">0</b>건</span>
        <span>호출 <b th:text="${aiJobs.callCount()}">0</b>건</span>
        <span>실패 <b th:classappend="${aiJobs.failureCount() > 0} ? 'text-error'" th:text="${aiJobs.failureCount()}">0</b>건</span>
        <span>추정 비용 합계 <b th:text="'$' + ${#numbers.formatDecimal(aiJobs.totalCostUsd(), 1, 6)}">$0</b></span>
      </div>
      <div class="overflow-x-auto">
        <table class="table table-sm">
          <thead>
          <tr>
            <th>시작</th>
            <th>종류</th>
            <th>상태</th>
            <th class="text-right">카드/그림</th>
            <th class="text-right">차감</th>
            <th class="text-right">호출(성공/실패)</th>
            <th class="text-right">추정 비용</th>
            <th>실패 사유</th>
          </tr>
          </thead>
          <tbody>
          <!-- th:replace 가 th:if 보다 먼저 실행된다. 조건을 바깥으로 뺀다 -->
          <th:block th:if="${aiJobs.jobs().isEmpty()}">
            <tr th:replace="~{admin/fragments/admin-ui :: emptyRow(8, '이 일과로 만든 AI 작업이 없어요')}"></tr>
          </th:block>
          <tr th:each="job : ${aiJobs.jobs()}">
            <!-- 작업 탐색은 작업 id 정확히 일치로 찾음 -->
            <td><a th:href="@{/admin/credits/jobs(q=${job.id()})}" class="link link-hover"
                   th:text="${@adminDate.format(job.startedAt())}">시각</a></td>
            <td th:text="${job.kindLabel()}">일과 생성</td>
            <td th:text="${job.statusLabel()}">정산</td>
            <td class="text-right" th:text="${job.cardCount()} + ' / ' + ${job.imageCount()}">0 / 0</td>
            <td class="text-right" th:text="${job.charged()}">0</td>
            <td class="text-right">
              <span th:text="${job.callCount()}">0</span>
              (<span th:text="${job.successCount()}">0</span>/<span th:classappend="${job.failureCount() > 0} ? 'text-error'"
                                                                    th:text="${job.failureCount()}">0</span>)
            </td>
            <td class="text-right" th:text="'$' + ${#numbers.formatDecimal(job.costUsd(), 1, 6)}">$0</td>
            <td class="text-xs text-error" th:title="${job.failReason()}"
                th:text="${job.failReason() == null ? '' : #strings.abbreviate(job.failReason(), 80)}">사유</td>
          </tr>
          </tbody>
        </table>
      </div>
      <p th:if="${aiJobs.isTruncated()}" class="text-xs text-base-content/60">
        최근 <span th:text="${aiJobs.jobs().size()}">50</span>건만 보여요. 합계도 이 작업들만 더했어요</p>
      <p class="text-xs text-base-content/60">질문·다시 만들기처럼 크레딧 작업에 묶이지 않은 호출은 합계에 없어요</p>
    </th:block>
  </div>
</div>

</body>
</html>
