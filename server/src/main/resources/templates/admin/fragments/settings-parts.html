<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  설정 화면 조각: 지금 적용 중, 다른 화면 바로가기, Free/Pro 비교, 설정 칸(표·패널), 표 한 행
  설정 칸은 시스템·AI·요금제 화면과 광고 보상·공지·서버 이전 화면이 함께 씀
-->
<body>

<!-- 지금 적용 중: 화면을 가리지 않는 핵심 상태. 누르면 그 설정이 있는 화면에서 패널이 열림 -->
<section th:fragment="highlights(overview)" data-settings-summary="highlights" class="card bg-base-100 shadow-md">
  <div class="card-body space-y-3">
    <h2 class="card-title text-lg">지금 적용 중</h2>
    <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3">
      <a th:each="highlight : ${overview.highlights()}" th:href="@{${highlight.openPath()}}" th:data-open-key="${highlight.key()}"
         class="flex items-center justify-between gap-3 rounded-box border border-base-300 px-3 py-2 hover:bg-base-200"
         th:classappend="${highlight.isDifferent()} ? 'border-warning'" data-highlight>
        <span class="text-sm text-base-content/70" th:text="${highlight.label()}">항목</span>
        <span class="badge" th:classappend="${highlight.isOn()} ? 'badge-success' : 'badge-ghost'"
              th:text="${highlight.valueText()}">값</span>
      </a>
    </div>
  </div>
</section>

<!-- 다른 화면에서 관리하는 설정: 화면별 설정 수·기본값과 다른 수 -->
<section th:fragment="sectionLinks(links)" class="card bg-base-100 shadow-md" data-settings-section-links>
  <div class="card-body space-y-3">
    <h2 class="card-title text-lg">다른 화면에서 관리하는 설정</h2>
    <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3">
      <a th:each="link : ${links}" th:href="@{${link.path()}}"
         class="flex items-center justify-between gap-3 rounded-box border border-base-300 px-3 py-2 hover:bg-base-200">
        <span class="font-medium" th:text="${link.label()}">AI 설정</span>
        <span class="flex items-center gap-1">
          <span class="badge badge-ghost" th:text="${link.settingCount()} + '개'">0개</span>
          <span th:if="${link.differsFromDefaultCount() > 0}" class="badge badge-warning"
                th:text="'바꾼 값 ' + ${link.differsFromDefaultCount()}">바꾼 값 0</span>
        </span>
      </a>
    </div>
  </div>
</section>

<!-- Free / Pro 비교: 값을 누르면 그 설정의 수정 패널 -->
<section th:fragment="planComparison(overview)" data-settings-summary="plans" class="card bg-base-100 shadow-md">
  <div class="card-body space-y-3">
    <h2 class="card-title text-lg">Free / Pro 비교</h2>
    <div class="overflow-x-auto">
      <table class="table table-sm" data-plan-comparison>
        <thead>
        <tr>
          <th>항목</th>
          <th>Free</th>
          <th>Pro</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="planRow : ${overview.planComparison()}">
          <td th:text="${planRow.label()}">항목</td>
          <td>
            <button type="button" th:data-open-key="${planRow.freeKey()}" class="badge"
                    th:classappend="${planRow.isFreeDifferent()} ? 'badge-warning' : 'badge-ghost'"
                    th:text="${planRow.freeValueText()}">값</button>
          </td>
          <td>
            <button type="button" th:data-open-key="${planRow.proKey()}" class="badge"
                    th:classappend="${planRow.isProDifferent()} ? 'badge-warning' : 'badge-ghost'"
                    th:text="${planRow.proValueText()}">값</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <p class="text-xs text-base-content/50">노란 값은 기본값과 다르게 바꾼 값이에요. 누르면 수정 패널이 열려요.</p>
  </div>
</section>

<!-- 설정 칸: 검색·칩·정렬 표 + 수정 패널 + 토스트 + 스크립트 (화면마다 한 번)
     저장하면 data-refresh-url 화면을 다시 받아 그 행과 요약만 갈아 끼움 -->
<th:block th:fragment="editor(editor, title)">
  <div class="card bg-base-100 shadow-md" data-settings-editor>
    <div class="card-body space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="card-title text-lg" th:text="${title}">설정</h2>
        <a th:href="@{/admin/settings/history}" class="link link-hover text-sm">변경 이력 전체 보기</a>
      </div>
      <div th:unless="${editor.isLoaded()}" class="alert alert-error" role="alert"
           th:text="${editor.loadErrorMessage()}">설정을 불러오지 못했어요.</div>
      <th:block th:if="${editor.isLoaded()}">
        <div class="flex flex-wrap items-center gap-2">
          <input type="search" data-settings-search placeholder="이름·키·값·설명·변경자로 찾기"
                 class="input input-bordered input-sm w-full sm:w-80"/>
          <span class="ml-auto text-sm text-base-content/50" data-settings-count></span>
        </div>
        <div class="flex flex-wrap gap-1" data-chip-bar>
          <button type="button" data-chip="all" class="btn btn-xs btn-primary">전체</button>
          <button type="button" data-chip="different" class="btn btn-xs btn-ghost">기본값과 다름</button>
          <button type="button" data-chip="today" class="btn btn-xs btn-ghost">오늘 변경</button>
          <button type="button" th:if="${editor.ruleWarningCount() > 0}" data-chip="warning" class="btn btn-xs btn-ghost text-error"
                  th:text="'규칙에 어긋난 값 ' + ${editor.ruleWarningCount()}">규칙에 어긋난 값</button>
          <th:block th:if="${editor.hasSeveralGroups()}">
            <button type="button" th:each="group : ${editor.groupLabelByName()}" th:attr="data-chip='group:' + ${group.key}"
                    th:text="${group.value}" class="btn btn-xs btn-ghost">그룹</button>
          </th:block>
        </div>
        <div class="overflow-x-auto">
          <table class="table table-sm" data-settings-table th:data-refresh-url="${editor.refreshPath()}">
            <thead>
            <tr>
              <th><button type="button" data-sort-by="name" class="link link-hover">설정 <span data-sort-mark></span></button></th>
              <th><button type="button" data-sort-by="current" class="link link-hover">현재 값 <span data-sort-mark></span></button></th>
              <th><button type="button" data-sort-by="default" class="link link-hover">기본값 <span data-sort-mark></span></button></th>
              <th><button type="button" data-sort-by="changed" class="link link-hover">마지막 변경 <span data-sort-mark>▼</span></button></th>
            </tr>
            </thead>
            <tbody>
            <!-- th:replace 가 th:each 보다 먼저 실행돼 한 태그에 두면 한 번만 그려짐 -->
            <th:block th:each="row : ${editor.rows()}">
              <tr th:replace="~{admin/fragments/settings-parts :: row(${row}, ${editor.today()})}"></tr>
            </th:block>
            <tr data-empty-row class="hidden">
              <td colspan="4" class="py-8 text-center text-base-content/50">조건에 맞는 설정이 없어요</td>
            </tr>
            </tbody>
          </table>
        </div>
      </th:block>
    </div>
  </div>

  <th:block th:if="${editor.isLoaded()}">
    <!-- 수정 패널: 행을 누르면 열림. 위젯·이력은 스크립트가 채움 -->
    <div data-settings-backdrop class="fixed inset-0 z-30 hidden bg-black/30"></div>
    <aside data-settings-panel aria-hidden="true"
           class="fixed inset-y-0 right-0 z-40 hidden w-full max-w-md overflow-y-auto bg-base-100 p-4 shadow-xl">
      <div class="flex items-start justify-between gap-2">
        <div>
          <h2 class="text-lg font-bold" data-panel-label></h2>
          <div class="font-mono text-xs text-base-content/50" data-panel-key></div>
        </div>
        <button type="button" data-panel-close class="btn btn-ghost btn-sm" aria-label="닫기">닫기</button>
      </div>
      <p class="mt-2 text-sm text-base-content/70" data-panel-description></p>
      <!-- 지금 저장값이 규칙에 어긋날 때 (읽기는 그대로, 고쳐서 저장하라는 안내) -->
      <div data-panel-warning role="alert" class="alert alert-warning mt-3 hidden py-2 text-sm"></div>
      <!-- yml 에 묶인 모델명 키: 실제 적용 값과 출처 -->
      <div data-panel-source class="mt-3 hidden rounded-box bg-base-200 p-2 text-xs"></div>
      <form data-panel-form class="mt-4 space-y-3">
        <div data-panel-widget class="space-y-2"></div>
        <!-- 허용 범위·형식 안내, 저장 실패 이유 (입력값은 그대로 둠) -->
        <p data-panel-hint class="text-xs text-base-content/60"></p>
        <p data-panel-error role="alert" class="hidden text-sm text-error"></p>
        <input type="text" name="reason" maxlength="500" placeholder="변경 사유 (선택) — 이력에 남아요"
               class="input input-bordered input-sm w-full"/>
        <div class="flex flex-wrap items-center gap-2">
          <button type="submit" class="btn btn-primary btn-sm">저장</button>
          <button type="button" data-panel-reset class="btn btn-ghost btn-sm">기본값으로 복원</button>
          <span class="text-xs text-base-content/50" data-panel-default></span>
        </div>
      </form>
      <h3 class="mt-6 font-semibold">이 설정의 변경 이력</h3>
      <div class="mt-2 space-y-2 text-sm" data-panel-history></div>
    </aside>
    <!-- 저장 결과: 방금 고친 행 근처에 띄움 (스크롤을 움직이지 않음) -->
    <div data-settings-toast role="status" class="alert fixed z-50 hidden max-w-sm py-2 text-sm shadow-lg"></div>

    <script th:src="@{/admin/js/settings.js}"></script>
    <script th:src="@{/admin/js/settings-member-picker.js}"></script>
    <script th:src="@{/admin/js/settings-panel.js}"></script>
  </th:block>
</th:block>

<!-- 표 한 행: 클릭하면 수정 패널. 정렬·검색·필터용 값은 data 속성에 -->
<tr th:fragment="row(row, today)" data-config-row class="hover cursor-pointer"
    th:data-key="${row.key()}"
    th:data-group="${row.groupName()}"
    th:data-different="${row.isDifferent()}"
    th:data-today="${row.isChangedOn(today)}"
    th:data-search="${row.searchText()}"
    th:data-sort-name="${#strings.toLowerCase(row.label())}"
    th:data-sort-current="${#strings.toLowerCase(row.displayValue())}"
    th:data-sort-default="${#strings.toLowerCase(row.defaultDisplayValue())}"
    th:data-sort-changed="${row.lastChangedAt() != null ? #temporals.format(row.lastChangedAt(), 'yyyyMMddHHmmss') : ''}"
    th:data-label="${row.label()}"
    th:data-description="${row.description()}"
    th:data-type="${row.valueType()}"
    th:data-allowed="${#strings.listJoin(row.allowedValues(), '|')}"
    th:data-min="${row.minValue()}"
    th:data-max="${row.maxValue()}"
    th:data-current="${row.currentValue()}"
    th:data-default="${row.defaultValue()}"
    th:data-default-display="${row.defaultDisplayValue()}"
    th:data-secret="${row.isSecret()}"
    th:data-format="${row.formatName()}"
    th:data-format-hint="${row.formatHint()}"
    th:data-warning="${row.hasValidationWarning()}"
    th:data-warning-text="${row.validationWarning()}"
    th:data-source="${row.valueSourceLabel()}"
    th:data-deploy-value="${row.deployPropertyValue()}">
  <td class="min-w-48">
    <div class="font-medium">
      <span th:text="${row.label()}">설정명</span>
      <span th:if="${row.isDifferent()}" class="badge badge-warning badge-sm ml-1">기본값과 다름</span>
      <span th:if="${row.isSecret() and row.displayValue() == '설정됨'}" class="badge badge-success badge-sm ml-1">설정됨</span>
      <!-- 저장 뒤 규칙이 바뀌어 지금 규칙에 맞지 않는 값: 읽기는 그대로, 고치라고 알림 -->
      <span th:if="${row.hasValidationWarning()}" class="badge badge-error badge-sm ml-1"
            th:title="${row.validationWarning()}">규칙에 어긋남</span>
    </div>
    <div class="font-mono text-xs text-base-content/50" th:text="${row.key()}">KEY</div>
  </td>
  <td class="max-w-xs">
    <div class="truncate" th:title="${row.displayValue()}" th:text="${row.displayValue()}">값</div>
    <!-- yml 에 묶인 모델명 키: 지금 값이 어디서 왔는지 (DB 값이 있으면 yml 은 쓰지 않음) -->
    <div th:if="${row.hasDeployProperty()}" class="text-xs text-base-content/50"
         th:text="'출처: ' + ${row.valueSourceLabel()}">출처</div>
    <div th:if="${row.hasValidationWarning()}" class="max-w-xs truncate text-xs text-error"
         th:title="${row.validationWarning()}" th:text="${row.validationWarning()}">경고</div>
  </td>
  <td class="max-w-xs text-base-content/60">
    <div class="truncate" th:title="${row.defaultDisplayValue()}"
         th:text="${row.isSecret() ? '-' : row.defaultDisplayValue()}">기본값</div>
  </td>
  <td class="min-w-44">
    <span th:replace="~{admin/fragments/admin-list :: lastChangedOr(${row.lastChangedAt()}, ${row.lastChangedBy()},
      ${row.isDifferent() ? '변경 이력 없음 (이력 없이 바뀐 값)' : '기본 설정 (변경 이력 없음)'})}"></span>
    <div th:if="${row.lastReason() != null and !row.lastReason().isBlank()}"
         class="max-w-xs truncate text-xs text-base-content/50" th:title="${row.lastReason()}"
         th:text="${row.lastReason()}">사유</div>
  </td>
</tr>

</body>
</html>
