<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  회원 크레딧 요약 카드 (회원 상세, 의견 상세 보낸 회원 패널 공용, #651 · #655).
  상태 3개: 불러옴(hasAccount), 계정 없음, 불러오기 실패(isLoadFailed). 탈퇴 회원 숨김은 쓰는 쪽이 정한다.
-->
<body>

<div th:fragment="creditSummaryCard(creditSummary, memberId)" class="card bg-base-100 shadow-md" data-member-credit-summary>
  <div class="card-body p-4 gap-3">
    <div class="flex items-center gap-2 flex-wrap">
      <h2 class="card-title text-lg">AI 크레딧 (이번 주)</h2>
      <span th:if="${creditSummary.isFrozen()}" class="badge badge-error badge-sm">동결</span>
      <a th:href="@{/admin/credits/members/{id}(id=${memberId})}" class="link link-primary text-sm ml-auto">자세히</a>
    </div>
    <p th:if="${creditSummary.isLoadFailed()}" class="text-sm text-error" role="alert">
      크레딧 정보를 불러오지 못했어요. 잠시 뒤 새로 고쳐 주세요. (E-ADM-CREDIT-001)
    </p>
    <p th:if="${!creditSummary.isLoadFailed() and !creditSummary.hasAccount()}" class="text-sm text-base-content/60">
      아직 크레딧 기록이 없어요
    </p>
    <div th:if="${creditSummary.hasAccount()}" class="stats stats-vertical sm:stats-horizontal bg-base-200 w-full">
      <div class="stat py-2">
        <div class="stat-title">사용 가능</div>
        <div class="stat-value text-2xl" th:text="${#numbers.formatInteger(creditSummary.available(), 1, 'COMMA')}">0</div>
      </div>
      <div class="stat py-2">
        <div class="stat-title">주간 지급</div>
        <div class="stat-value text-2xl" th:text="${#numbers.formatInteger(creditSummary.weeklyGrant(), 1, 'COMMA')}">0</div>
      </div>
      <div class="stat py-2">
        <div class="stat-title">보너스</div>
        <div class="stat-value text-2xl" th:text="${#numbers.formatInteger(creditSummary.bonus(), 1, 'COMMA')}">0</div>
      </div>
      <div class="stat py-2">
        <div class="stat-title">사용</div>
        <div class="stat-value text-2xl" th:text="${#numbers.formatInteger(creditSummary.used(), 1, 'COMMA')}">0</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
