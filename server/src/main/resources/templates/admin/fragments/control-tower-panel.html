<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  시스템 설정 "관제소 연동" 칸 (#1229): 켜짐, 수집 토큰 설정 여부(값은 보이지 않음), 마지막 관제소 수집, 지금 내보내는 항목
  켜기/끄기는 아래 설정 표의 CONTROL_TOWER_ATTENTION_ENABLED 패널 (변경 이력에 남음)
-->
<body>

<section th:fragment="panel(panel)" data-control-tower-panel class="card bg-base-100 shadow-md">
  <div class="card-body space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h2 class="card-title text-lg">관제소 연동</h2>
      <a th:href="@{/admin/settings#setting=CONTROL_TOWER_ATTENTION_ENABLED}" data-open-key="CONTROL_TOWER_ATTENTION_ENABLED"
         class="btn btn-sm btn-outline">켜기/끄기 바꾸기</a>
    </div>
    <p class="text-sm text-base-content/60">
      관제소가 <code>GET /control/attention</code> 으로 확인할 일 개수와 값만 모아 가요. 의견 내용·회원 정보는 나가지 않아요.
    </p>

    <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-4">
      <div class="flex items-center justify-between gap-3 rounded-box border border-base-300 px-3 py-2">
        <span class="text-sm text-base-content/70">내보내기</span>
        <span data-control-tower-enabled class="badge" th:classappend="${panel.isEnabled()} ? 'badge-success' : 'badge-ghost'"
              th:text="${panel.isEnabled()} ? '켜짐' : '꺼짐 (404)'">꺼짐</span>
      </div>
      <div class="flex items-center justify-between gap-3 rounded-box border border-base-300 px-3 py-2">
        <span class="text-sm text-base-content/70">수집 토큰</span>
        <span data-control-tower-token class="badge" th:classappend="${panel.isTokenConfigured()} ? 'badge-success' : 'badge-error'"
              th:text="${panel.isTokenConfigured()} ? '설정됨' : '없음 (모두 401)'">없음</span>
      </div>
      <div class="flex items-center justify-between gap-3 rounded-box border border-base-300 px-3 py-2">
        <span class="text-sm text-base-content/70">관리자 주소</span>
        <span class="badge" th:classappend="${panel.hasHttpsAdminBaseUrl()} ? 'badge-success' : 'badge-warning'"
              th:text="${panel.hasHttpsAdminBaseUrl()} ? 'https 설정됨' : '없음 (링크 빠짐)'">없음</span>
      </div>
      <div class="flex items-center justify-between gap-3 rounded-box border border-base-300 px-3 py-2"
           title="이 서버가 시작된 뒤 토큰 검사를 통과한 마지막 요청">
        <span class="text-sm text-base-content/70">마지막 관제소 수집</span>
        <span data-control-tower-last-collected class="text-sm font-medium"
              th:text="${panel.lastCollectedAt() == null} ? '아직 없음' : ${@adminDate.format(panel.lastCollectedAt())}">아직 없음</span>
      </div>
    </div>

    <p th:if="${panel.previewFailureMessage() != null}" class="text-sm text-error" th:text="${panel.previewFailureMessage()}">실패</p>
    <div th:if="${panel.preview() != null}" class="overflow-x-auto">
      <table class="table table-sm" data-control-tower-preview>
        <thead>
        <tr>
          <th>항목</th>
          <th>key</th>
          <th>값</th>
          <th>수준</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${panel.preview().items()}" th:data-item-key="${item.key()}">
          <td th:text="${item.label()}">새 의견</td>
          <td><code class="text-xs" th:text="${item.key()}">feedback.new</code></td>
          <td th:if="${item.count() != null}" th:text="${item.count()} + '건'">0건</td>
          <td th:if="${item.count() == null}"
              th:text="'$' + ${#numbers.formatDecimal(item.value(), 1, 2)} + (${item.limit() != null} ? ' / $' + ${#numbers.formatDecimal(item.limit(), 1, 2)} : ' (상한 꺼짐)')">$0</td>
          <td>
            <span class="badge badge-sm" th:text="${item.level().toJsonValue()}"
                  th:classappend="${item.level().name() == 'CRITICAL'} ? 'badge-error' : (${item.level().name() == 'WARNING'} ? 'badge-warning' : (${item.level().name() == 'INFO'} ? 'badge-info' : 'badge-ghost'))">ok</span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

</body>
</html>
