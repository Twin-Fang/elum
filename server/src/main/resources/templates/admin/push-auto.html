<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: page('자동 알림 관리', 'push-auto', ~{:: content})}">
<body>

<!-- 자동 알림 관리 (#1275): 종류마다 카드 한 장 (켜기, 제목·본문 틀 + 미리 보기, 보내는 시각, 최소 간격) > 저장은 종류별 폼
     미리 보기는 예시 값으로 변수만 바꿈 (서버 문구 렌더링과 같은 규칙: 빈 값은 기본 말) -->
<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6 max-w-4xl">
  <div th:replace="~{admin/fragments/admin-ui :: pageHeader('자동 알림 관리', '조건에 맞는 보호자에게 하루 최대 1개까지 자동으로 보내요. 밤 9시 ~ 아침 8시에는 보내지 않고, 보호자가 알림 설정에서 종류별로 끌 수 있어요.')}"></div>

  <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
  <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}"></div>

  <div class="alert alert-info text-sm" role="note">
    <span>쓸 수 있는 변수: <span class="font-mono" th:text="${#strings.listJoin(templateVariables, ' ')}">{아이이름}</span>.
      값이 없으면 {아이이름}은 '이룸이', {일과}는 '일과'로 들어가요. 처음에는 모두 꺼져 있어요. 문구를 확인한 뒤 켜 주세요.</span>
  </div>

  <th:block th:if="${#lists.isEmpty(rules)}">
    <div th:replace="~{admin/fragments/admin-ui :: emptyState('자동 알림 규칙이 없어요. 서버 마이그레이션(V74)을 확인해 주세요')}"></div>
  </th:block>

  <form th:each="rule : ${rules}" method="post" th:action="@{/admin/push/auto/{type}(type=${rule.type.name()})}"
        class="card bg-base-100 shadow-md" data-auto-rule>
    <div class="card-body space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="card-title text-base" th:text="${rule.type.label}">오늘 일과 보내기</h2>
          <p class="text-sm text-base-content/60" th:text="${rule.type.conditionDescription}">조건</p>
        </div>
        <label class="label cursor-pointer gap-2">
          <span class="label-text">켜기</span>
          <input type="checkbox" name="enabled" value="true" class="toggle toggle-primary" th:checked="${rule.enabled}"/>
        </label>
      </div>

      <label class="form-control">
        <div class="label"><span class="label-text">제목 <span class="text-error">*</span></span></div>
        <input type="text" name="titleTemplate" class="input input-bordered" th:maxlength="${titleMaxLength}"
               th:value="${rule.titleTemplate}" data-auto-title required/>
      </label>
      <label class="form-control">
        <div class="label"><span class="label-text">본문 <span class="text-error">*</span></span></div>
        <textarea name="bodyTemplate" class="textarea textarea-bordered h-20 text-sm" th:maxlength="${bodyMaxLength}"
                  th:text="${rule.bodyTemplate}" data-auto-body required></textarea>
      </label>

      <!-- 미리 보기: 예시 값(하늘이, 아침 준비, 다음 주 날짜)으로 바꾼 문구 -->
      <div class="rounded-box bg-base-200 p-3 text-sm" aria-live="polite">
        <div class="text-xs text-base-content/60">미리 보기 (예시 값)</div>
        <div class="font-bold" data-auto-preview-title></div>
        <div data-auto-preview-body></div>
      </div>

      <div class="flex flex-wrap items-end gap-4">
        <label class="form-control">
          <div class="label"><span class="label-text">누르면 갈 화면</span></div>
          <select name="route" class="select select-bordered select-sm w-32">
            <option th:each="route : ${routeOptions}" th:value="${route.wire}" th:text="${route.label}"
                    th:selected="${route == rule.route}">홈</option>
          </select>
        </label>
        <div th:if="${rule.type.hasFixedSendTime}" class="form-control">
          <div class="label"><span class="label-text">보내는 시각 (8시~20시)</span></div>
          <div class="flex items-center gap-1">
            <input type="number" name="sendHour" min="8" max="20" class="input input-bordered input-sm w-20"
                   th:value="${rule.sendHour}" required/>
            <span>시</span>
            <input type="number" name="sendMinute" min="0" max="59" class="input input-bordered input-sm w-20"
                   th:value="${rule.sendMinute}" required/>
            <span>분</span>
          </div>
        </div>
        <p th:unless="${rule.type.hasFixedSendTime}" class="text-sm text-base-content/60">시각 없이 일이 생긴 뒤 바로 보내요 (야간이면 아침 8시에)</p>
        <label class="form-control">
          <div class="label"><span class="label-text">같은 사람 최소 간격 (일)</span></div>
          <input type="number" name="minIntervalDays" th:min="${minimumIntervalDays}" th:max="${maximumIntervalDays}"
                 class="input input-bordered input-sm w-24" th:value="${rule.minIntervalDays}" required/>
        </label>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3">
        <span class="text-xs text-base-content/60"
              th:text="${rule.updatedBy != null} ? ('마지막 저장: ' + ${rule.updatedBy} + ' · ' + ${#temporals.format(rule.updatedAt, 'yyyy-MM-dd HH:mm')}) : '아직 저장한 적 없음'">마지막 저장</span>
        <button type="submit" class="btn btn-sm btn-primary">저장</button>
      </div>
    </div>
  </form>

  <script>
    (function () {
      'use strict';

      // 예시 값 (서버 기본 말과 같은 규칙: 비면 이룸이·일과)
      var nextWeek = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
      var sampleValues = {
        '{아이이름}': '하늘이',
        '{일과}': '아침 준비',
        '{날짜}': (nextWeek.getMonth() + 1) + '월 ' + nextWeek.getDate() + '일'
      };

      function render(template) {
        var rendered = template || '';
        Object.keys(sampleValues).forEach(function (variable) {
          rendered = rendered.split(variable).join(sampleValues[variable]);
        });
        return rendered.trim();
      }

      document.querySelectorAll('[data-auto-rule]').forEach(function (form) {
        var titleInput = form.querySelector('[data-auto-title]');
        var bodyInput = form.querySelector('[data-auto-body]');
        var previewTitle = form.querySelector('[data-auto-preview-title]');
        var previewBody = form.querySelector('[data-auto-preview-body]');

        function refreshPreview() {
          previewTitle.textContent = render(titleInput.value);
          previewBody.textContent = render(bodyInput.value);
        }

        titleInput.addEventListener('input', refreshPreview);
        bodyInput.addEventListener('input', refreshPreview);
        refreshPreview();
      });
    })();
  </script>
</main>

</body>
</html>
