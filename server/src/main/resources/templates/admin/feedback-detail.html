<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: page('의견 상세', 'feedback', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6">
  <div class="flex items-center justify-between flex-wrap gap-2">
    <div class="flex items-center gap-2">
      <h1 class="text-2xl font-bold">의견 상세</h1>
      <span th:if="${feedback.hasAppLog()}" class="badge badge-info">앱 상태 기록 있음</span>
      <span th:unless="${feedback.hasAppLog()}" class="badge badge-ghost">앱 상태 기록 없음</span>
      <span th:if="${feedback.appLogErrorCount() > 0}" class="badge badge-error"
            th:text="'오류 ' + ${feedback.appLogErrorCount()} + '건'">오류 1건</span>
    </div>
    <div class="flex items-center gap-2">
      <a th:href="@{/admin/feedback}" class="btn btn-ghost btn-sm">목록으로</a>
      <form th:action="@{/admin/feedback/{id}/delete(id=${feedback.id})}" method="post"
            data-confirm-title="의견 지우기" data-confirm-danger data-confirm-accept="지우기"
            data-confirm-message="이 의견을 지울까요? 되돌릴 수 없어요.">
        <button type="submit" class="btn btn-error btn-sm">지우기</button>
      </form>
    </div>
  </div>

  <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
  <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}"></div>

  <!-- 처리 상태: 바꾼 관리자와 시각이 남는다. -->
  <div class="card bg-base-100 shadow-md border border-base-300">
    <div class="card-body">
      <h2 class="card-title text-lg">처리 상태</h2>
      <div class="flex flex-wrap items-center gap-3">
      <span class="badge"
            th:classappend="${feedback.status.name() == 'NEW'} ? 'badge-warning' : (${feedback.status.name() == 'DONE'} ? 'badge-success' : 'badge-info')"
            th:text="${feedback.status.label}" data-feedback-status>새 의견</span>
      <span th:replace="~{admin/fragments/admin-list :: lastChangedOr(${feedback.statusChangedAt}, ${feedback.statusChangedBy}, '변경 이력 없음')}"></span>
      <form th:replace="~{admin/fragments/feedback-status-form :: statusForm(${feedback}, ${statuses}, null, 'detail')}"></form>
      </div>
    </div>
  </div>

  <!-- 관리자 메모 (#655): 관리자끼리만 본다. 비우고 저장하면 지운다. 사용자 입력이라 th:text 로 이스케이프 -->
  <div class="card bg-base-100 shadow-md border border-base-300" data-feedback-admin-note>
    <div class="card-body space-y-2">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <h2 class="card-title text-lg">관리자 메모</h2>
        <span th:replace="~{admin/fragments/admin-list :: lastChangedOr(${feedback.adminNoteChangedAt}, ${feedback.adminNoteChangedBy}, '메모 기록 없음')}"></span>
      </div>
      <form th:action="@{/admin/feedback/{id}/note(id=${feedback.id})}" method="post" class="space-y-2">
        <textarea name="adminNote" rows="4" class="textarea textarea-bordered w-full"
                  th:attr="maxlength=${adminNoteMaxLength}"
                  placeholder="처리한 내용이나 다음 관리자에게 남길 말을 적어 주세요. 비우고 저장하면 메모를 지워요."
                  th:text="${feedback.adminNote}"></textarea>
        <div class="flex justify-end">
          <button type="submit" class="btn btn-primary btn-sm">메모 저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 보낸 때와 환경. 의견·기록은 사용자 입력이라 아래 모든 출력은 th:text 로 이스케이프한다. -->
  <div class="grid grid-cols-2 lg:grid-cols-3 gap-3">
    <div class="stat rounded-box bg-base-200 shadow">
      <div class="stat-title text-sm">보낸 때</div>
      <div class="stat-value text-lg"
           th:text="${feedback.createdAt != null ? #temporals.format(feedback.createdAt, 'yyyy-MM-dd') : '-'}">2026-10-08</div>
      <div class="stat-desc"
           th:text="${feedback.createdAt != null ? #temporals.format(feedback.createdAt, 'HH:mm:ss') : ''}">10:00:00</div>
    </div>
    <div class="stat rounded-box bg-base-200 shadow">
      <div class="stat-title text-sm">앱 버전</div>
      <div class="stat-value text-lg"
           th:text="${feedback.appVersion != null ? feedback.appVersion : '-'}">1.0.40</div>
    </div>
    <div class="stat rounded-box bg-base-200 shadow">
      <div class="stat-title text-sm">OS</div>
      <div class="stat-value text-lg break-words"
           th:text="${feedback.os != null ? feedback.os : '-'}">iOS 18.1</div>
    </div>
  </div>

  <div class="card bg-base-100 shadow-md border border-base-300">
    <div class="card-body space-y-2">
      <h2 class="card-title text-lg">의견</h2>
      <p class="text-base leading-relaxed whitespace-pre-wrap wrap-anywhere"
         th:text="${feedback.message}">의견 전체</p>
    </div>
  </div>

  <div th:replace="~{admin/fragments/feedback-sender-panel :: senderPanel(${feedback}, ${senderPanel})}"></div>

  <div class="card bg-base-100 shadow-md border border-base-300">
    <div class="card-body space-y-2">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <h2 class="card-title text-lg">앱 상태 기록</h2>
        <div th:if="${feedback.hasAppLog()}" class="flex items-center gap-2">
          <span class="text-xs text-base-content/60"
                th:text="${#strings.length(feedback.appLog)} + '자'">1234자</span>
          <button type="button" class="btn btn-outline btn-xs"
                  onclick="navigator.clipboard.writeText(document.getElementById('app-log').textContent).then(() => { this.textContent = '복사했어요'; })">
            복사
          </button>
        </div>
      </div>
      <p th:unless="${feedback.hasAppLog()}" class="text-sm text-base-content/60">
        보내는 사람이 앱 상태 기록 보내기를 끄고 보냈어요.
      </p>
      <pre th:if="${feedback.hasAppLog()}" id="app-log"
           class="rounded-box bg-neutral text-neutral-content p-4 text-xs leading-relaxed max-h-96 overflow-auto whitespace-pre-wrap wrap-anywhere"
           th:text="${feedback.appLog}">기록</pre>
    </div>
  </div>
</main>
</body>
</html>
