<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: page('이야기 관리', 'talk', ~{:: content})}">
<body>

<main th:fragment="content" class="flex-1 p-4 lg:p-8 space-y-6">
  <div th:replace="~{admin/fragments/admin-ui :: pageHeader('이야기 관리',
       '보호자가 이야기에 올린 글이에요. 신고가 들어와도 저절로 가려지지 않아요. 글 상세에서 보고 가리거나 되돌려요.')}"></div>

  <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
  <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}"></div>

  <div class="flex items-center gap-3 flex-wrap">
    <div th:replace="~{admin/fragments/admin-list :: filterBar(${definition}, ${query})}"></div>
    <a th:href="@{/admin/talk/posts}" class="btn btn-ghost btn-sm">초기화</a>
    <a th:href="@{/admin/talk/reports(resolved='false')}" class="btn btn-outline btn-sm" data-talk-reports-link>
      처리하지 않은 신고
      <span class="badge badge-error badge-sm" th:if="${unresolvedReportCount > 0}"
            th:text="${unresolvedReportCount}">3</span>
    </a>
    <!-- 일괄 가리기: 표의 체크 칸(form 속성으로 연결)을 보냄, 고른 글이 없으면 버튼이 꺼져 있음 -->
    <form id="talk-bulk-hide-form" th:action="@{/admin/talk/posts/hide}" method="post"
          data-confirm-title="선택한 글 가리기" data-confirm-danger data-confirm-accept="가리기"
          data-confirm-message="선택한 글을 가릴까요? 앱에서 더 이상 보이지 않고, 들어온 신고도 처리돼요. 글 상세에서 글을 되돌릴 수 있어요.">
      <button type="submit" class="btn btn-warning btn-sm" data-talk-bulk-hide-button disabled>
        선택한 글 가리기 <span data-talk-bulk-hide-count>0</span>
      </button>
    </form>
    <span class="text-sm text-base-content/60 ml-auto">총 <span th:text="${posts.totalElements}">0</span>건</span>
  </div>

  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead>
      <tr>
        <th class="w-8">
          <input type="checkbox" class="checkbox checkbox-xs" aria-label="이 쪽의 보이는 글 모두 선택"
                 data-talk-select-all-visible/>
        </th>
        <th:block th:replace="~{admin/fragments/admin-list :: sortHeaders(${definition}, ${query})}"></th:block>
      </tr>
      </thead>
      <tbody>
      <!-- th:replace 가 th:if 보다 먼저 실행된다. 조건을 바깥으로 뺀다. -->
      <th:block th:if="${posts.isEmpty()}">
        <tr th:replace="~{admin/fragments/admin-ui :: emptyRow(9, (${query.q != null or !query.filters.isEmpty()} ? '조건에 맞는 글이 없어요' : '아직 올라온 글이 없어요'))}"></tr>
      </th:block>
      <tr th:each="row : ${posts.content}">
        <td>
          <!-- 보이는 글만 고를 수 있음 (가린 글·지운 글은 바꿀 게 없음) -->
          <input th:if="${row.post.status.name() == 'VISIBLE'}" type="checkbox" class="checkbox checkbox-xs"
                 name="postIds" th:value="${row.post.id}" form="talk-bulk-hide-form"
                 th:aria-label="${row.post.title} + ' 선택'" data-talk-post-checkbox/>
        </td>
        <td class="text-xs whitespace-nowrap" th:text="${@adminDate.format(row.post.createdAt)}">2026-10-20 10:00</td>
        <td class="wrap-anywhere" style="min-width:12rem">
          <a th:href="@{/admin/talk/posts/{id}(id=${row.post.id})}" class="link link-hover"
             th:text="${row.post.title.isBlank()} ? '(지운 글)' : ${#strings.abbreviate(row.post.title, 40)}">제목</a>
        </td>
        <td class="text-xs">
          <a th:href="@{/admin/members/{id}(id=${row.post.authorMemberId})}" class="link link-hover"
             th:text="${row.authorNickname != null ? row.authorNickname : '(닉네임 없음)'}">닉네임</a>
        </td>
        <td class="text-xs" th:text="${row.post.category != null} ? ${row.post.category.label} : ${row.post.visibility.label}">SELF_CARE</td>
        <td>
          <span class="badge badge-sm"
                th:classappend="${row.post.status.name() == 'VISIBLE'} ? 'badge-success' : (${row.post.status.name() == 'HIDDEN_BY_ADMIN'} ? 'badge-warning' : 'badge-ghost')"
                th:text="${row.post.status.label}" data-talk-status>보이는 글</span>
        </td>
        <td>
          <span th:if="${row.unresolvedReportCount > 0}" class="badge badge-error badge-sm"
                th:text="${row.unresolvedReportCount} + '건'" data-talk-report-count>1건</span>
          <span th:unless="${row.unresolvedReportCount > 0}" class="text-xs text-base-content/60"
                data-talk-report-count>0건</span>
        </td>
        <td class="text-xs whitespace-nowrap"
            th:text="'도움 ' + ${row.post.helpfulCount} + ' · 댓글 ' + ${row.post.commentCount} + ' · 가져감 ' + ${row.post.importCount}">도움 0 · 댓글 0 · 가져감 0</td>
        <td>
          <a th:href="@{/admin/talk/posts/{id}(id=${row.post.id})}" class="btn btn-primary btn-xs">보기</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div th:replace="~{admin/fragments/admin-list :: pager(${posts}, @{${pagerBaseUrl}})}"></div>

  <script>
    (function () {
      'use strict';
      var checkboxes = Array.prototype.slice.call(document.querySelectorAll('[data-talk-post-checkbox]'));
      var selectAll = document.querySelector('[data-talk-select-all-visible]');
      var button = document.querySelector('[data-talk-bulk-hide-button]');
      var count = document.querySelector('[data-talk-bulk-hide-count]');

      function refresh() {
        var checkedCount = checkboxes.filter(function (box) { return box.checked; }).length;
        count.textContent = String(checkedCount);
        button.disabled = checkedCount === 0;
        selectAll.checked = checkboxes.length > 0 && checkedCount === checkboxes.length;
        selectAll.disabled = checkboxes.length === 0;
      }

      checkboxes.forEach(function (box) { box.addEventListener('change', refresh); });
      selectAll.addEventListener('change', function () {
        checkboxes.forEach(function (box) { box.checked = selectAll.checked; });
        refresh();
      });
      refresh();
    })();
  </script>
</main>
</body>
</html>
